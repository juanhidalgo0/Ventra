name: Release Desktop App

# Push a tag like "v1.0.2" (matching the "version" in src-tauri/tauri.conf.json)
# to build, sign, and publish a new Ventra desktop release automatically.
# Every installed app checks this repo's latest release for updates.
on:
  push:
    tags:
      - 'v*.*.*'

# The default GITHUB_TOKEN is read-only unless a workflow says otherwise —
# tauri-action needs contents:write to create the release and upload assets.
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      # .env is gitignored and tauri.conf.json bundles it into the installer, so
      # a fresh CI checkout has no .env at all — the resource path has to exist
      # for the tauri-action bundling step to succeed. Every setting the backend
      # actually needs is already passed straight to the process by
      # src-tauri/src/lib.rs when it spawns Node (DATABASE_URL, Firebase creds,
      # sync token, etc.), so this is intentionally just a placeholder — no
      # secrets go in it, since this repo is public and it ships inside the
      # publicly downloadable installer.
      - name: Create placeholder .env (required to exist for bundling)
        shell: bash
        run: touch .env

      - name: Reset local dev database (fresh schema, no seed data bundled)
        run: npm run db:reset
        env:
          # schema.prisma reads this from the environment (no default) — there's
          # no .env file checked out in CI, so this has to be set explicitly or
          # `prisma db push` fails with "Environment variable not found".
          DATABASE_URL: "file:./dev.db"

      - name: Build frontend
        run: npm run build:frontend

      - name: Build backend
        run: npm run build:backend

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Ventra v__VERSION__'
          releaseBody: 'Ver los cambios de esta versión.'
          releaseDraft: false
          prerelease: false

      # Notify every running desktop app instantly (Firestore realtime push),
      # instead of each one waiting for its next periodic update check.
      - name: Push instant update notification
        # Llama a la función publishDesktopVersion del proyecto de Ventra (ventra-9cba5).
        # Requiere el secreto RELEASE_PUSH_SECRET en GitHub (Settings → Secrets → Actions),
        # con el mismo valor que el secreto de la función. Si falla, no frena el release:
        # los POS igual encuentran la versión en su chequeo periódico.
        continue-on-error: true
        env:
          RELEASE_PUSH_SECRET: ${{ secrets.RELEASE_PUSH_SECRET }}
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          Invoke-RestMethod -Method Post `
            -Uri "https://us-central1-ventra-9cba5.cloudfunctions.net/publishDesktopVersion" `
            -Headers @{ "x-release-secret" = $env:RELEASE_PUSH_SECRET } `
            -ContentType "application/json" `
            -Body (@{ version = $version } | ConvertTo-Json)
        shell: pwsh
