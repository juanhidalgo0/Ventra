name: Release Desktop App

# Push a tag like "v1.0.2" (matching the "version" in src-tauri/tauri.conf.json)
# to build and sign a new Ventra desktop release.
#
# Los instaladores se publican en el repositorio público juanhidalgo0/ventra-releases
# (el código puede quedar privado) y quedan como BORRADOR: ninguna PC los ve hasta
# probarlos y correr el workflow "Publicar version" (publish-release.yml).
# Transición: mientras haya PCs que buscan actualizaciones en este repositorio, la
# misma versión se copia acá (también como borrador).
on:
  push:
    tags:
      - 'v*.*.*'

# The default GITHUB_TOKEN is read-only unless a workflow says otherwise —
# tauri-action needs contents:write to create the release and upload assets.
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      # .env is gitignored and tauri.conf.json bundles it into the installer, so
      # a fresh CI checkout has no .env at all — the resource path has to exist
      # for the tauri-action bundling step to succeed. Every setting the backend
      # actually needs is already passed straight to the process by
      # src-tauri/src/lib.rs when it spawns Node (DATABASE_URL, Firebase creds,
      # sync token, etc.), so this is intentionally just a placeholder — no
      # secrets go in it, since this repo is public and it ships inside the
      # publicly downloadable installer.
      - name: Create placeholder .env (required to exist for bundling)
        shell: bash
        run: touch .env

      - name: Reset local dev database (fresh schema, no seed data bundled)
        run: npm run db:reset
        env:
          # schema.prisma reads this from the environment (no default) — there's
          # no .env file checked out in CI, so this has to be set explicitly or
          # `prisma db push` fails with "Environment variable not found".
          DATABASE_URL: "file:./dev.db"

      - name: Build frontend
        run: npm run build:frontend

      - name: Build backend
        run: npm run build:backend

      # RELEASES_TOKEN: token de GitHub que solo puede escribir en ventra-releases
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: juanhidalgo0
          repo: ventra-releases
          releaseCommitish: main
          tagName: ${{ github.ref_name }}
          releaseName: 'Ventra v__VERSION__'
          releaseBody: 'Ver los cambios de esta versión.'
          releaseDraft: true
          prerelease: false

      # Transición: las PCs con versiones anteriores buscan en este repositorio
      - name: Copiar la versión a este repositorio (borrador)
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p mirror
          GH_TOKEN="$RELEASES_TOKEN" gh release download "$TAG" -R juanhidalgo0/ventra-releases -D mirror
          GH_TOKEN="$GITHUB_TOKEN" gh release create "$TAG" mirror/* -R "${{ github.repository }}" --draft --title "Ventra v${TAG#v}" --notes "Ver los cambios de esta versión."
