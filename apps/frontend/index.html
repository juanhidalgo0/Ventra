<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E6E52" />
    <meta name="description" content="Ventra - Sistema de ventas para comercios argentinos: caja, inventario y tienda online." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ventra" />
    <script>
      (function() {
        const theme = localStorage.getItem('theme') || 'dark';
        const isPOS = window.location.hash.includes('/pos') || window.location.pathname.includes('/pos');
        if (theme === 'dark' && isPOS) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <title>Ventra — POS</title>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen">
    <div id="root"><div id="pwa-splash"><img src="./icon-192.png" alt="" width="84" height="84" /><span></span></div></div>
    <style>
      /* Pantalla de apertura verde solo en la app instalada; React la reemplaza al arrancar */
      #pwa-splash { display: none; }
      @media (display-mode: standalone) {
        #pwa-splash { display: flex; position: fixed; inset: 0; background: #0E6E52; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
        #pwa-splash img { border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
        #pwa-splash span { width: 26px; height: 26px; border: 3px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: pwa-spin .8s linear infinite; }
        @keyframes pwa-spin { to { transform: rotate(360deg); } }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // La app instalable (PWA) solo existe en la web por https. En la app de escritorio
      // (Tauri/Electron) y en desarrollo no hay service worker: se borra si quedó alguno.
      if ('serviceWorker' in navigator) {
        const isWeb = location.protocol === 'https:' && !/tauri/.test(location.hostname) && !/electron/i.test(navigator.userAgent);
        if (isWeb) {
          window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
        } else {
          navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
        }
      }
    </script>
  </body>
</html>
