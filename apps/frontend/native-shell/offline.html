<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ventra · Sin conexión</title>
<style>
  :root { --green: #0E6E52; --bg: #F6F8F7; --ink: #0F172A; --muted: #64748B; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);
    text-align: center;
  }
  main { max-width: 320px; }
  .icon {
    width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 22px;
    background: rgba(14, 110, 82, .1); display: flex; align-items: center; justify-content: center;
  }
  h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: -.01em; }
  p { font-size: 15px; line-height: 1.5; color: var(--muted); margin: 0 0 24px; }
  button {
    width: 100%; height: 48px; border: 0; border-radius: 14px;
    background: var(--green); color: #fff; font-size: 15px; font-weight: 700;
  }
  button:active { opacity: .85; }
</style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0E6E52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.5"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="m2 2 20 20"/></svg>
    </div>
    <h1>Sin conexión</h1>
    <p>Ventra necesita internet para mostrarte tu negocio. Revisá el wifi o los datos y probá de nuevo.</p>
    <button onclick="location.replace('https://web.ventra.store')">Reintentar</button>
  </main>
</body>
</html>
