<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ventra</title>
<style>
  /* Ventana de arranque (Tauri, sin bordes): se ve mientras carga la ventana principal.
     Solo CSS, sin fuentes externas: tiene que verse bien en cualquier PC y al instante. */
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #FFFFFF;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }
  body {
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 28px 30px 26px;
    border: 1px solid #E2E8F0;
    font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #0F172A;
    -webkit-font-smoothing: antialiased;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand img {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: block;
  }
  .brand span {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  h1 {
    margin: 0;
    font-size: 22px;
    line-height: 1.25;
    font-weight: 600;
    letter-spacing: -0.02em;
    max-width: 300px;
  }
  .status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 12px;
    color: #64748B;
  }
  .track {
    position: relative;
    height: 2px;
    background: #F1F5F9;
    border-radius: 2px;
    overflow: hidden;
  }
  .track::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 32%;
    border-radius: 2px;
    background: #0E6E52;
    animation: slide 1.4s cubic-bezier(.45, 0, .2, 1) infinite;
  }
  @keyframes slide {
    from { transform: translateX(-100%); }
    to   { transform: translateX(320%); }
  }
  .version { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="brand">
    <img src="/ventra-logo.png" alt="">
    <span>Ventra</span>
  </div>

  <h1>Tu caja, tu stock y tus ventas, en un solo lugar.</h1>

  <div>
    <div class="status">
      <span>Abriendo Ventra</span>
      <span class="version" id="version"></span>
    </div>
    <div class="track" role="progressbar" aria-label="Abriendo Ventra"></div>
  </div>

  <script>
    // Versión instalada (Tauri expone la API global; en el navegador no hay nada que mostrar)
    try {
      var app = window.__TAURI__ && window.__TAURI__.app;
      if (app && app.getVersion) app.getVersion().then(function (v) {
        document.getElementById('version').textContent = 'Versión ' + v;
      }).catch(function () {});
    } catch (e) {}
  </script>
</body>
</html>
