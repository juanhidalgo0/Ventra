<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ventra</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #FAF6F0;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  .mark {
    position: relative;
    width: 84px;
    height: 84px;
  }
  .mark img {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 22%;
    animation: breathe 2.4s ease-in-out infinite;
  }
  .mark::before {
    content: '';
    position: absolute;
    inset: -10px;
    border-radius: 9999px;
    padding: 2px;
    background: conic-gradient(from 0deg, transparent 0deg, #0E6E52 110deg, transparent 200deg);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: spin 1.6s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.045); }
  }
  .word {
    margin: 6px 0 0;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.01em;
    color: #17251E;
  }
  .word em {
    font-style: normal;
    color: #0E6E52;
  }
  .dots {
    display: flex;
    gap: 5px;
  }
  .dots span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #0E6E52;
    opacity: .3;
    animation: blink 1.2s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: .15s; }
  .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes blink {
    0%, 100% { opacity: .3; transform: translateY(0); }
    50%      { opacity: 1;  transform: translateY(-2px); }
  }
</style>
</head>
<body>
  <div class="mark">
    <img src="/ventra-logo.png" alt="Ventra">
  </div>
  <p class="word">Vent<em>ra</em></p>
  <div class="dots"><span></span><span></span><span></span></div>
</body>
</html>
