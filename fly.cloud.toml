# Ventra en la web (cajas en la nube). Separado de la demo (fly.toml).
app = 'ventra-cloud'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile.cloud'

[env]
  IDLE_MINUTES = '15'

[[mounts]]
  source = 'tenants'
  destination = '/data'
  initial_size = '3gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    path = '/_ventra/health'
    timeout = '5s'

[[vm]]
  memory = '2gb'
  cpus = 2
