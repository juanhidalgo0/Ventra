<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title id="pageTitle">Tienda online</title>
<meta name="description" id="metaDesc" content="Hacé tu pedido online y envialo por WhatsApp.">
<meta name="theme-color" id="metaTheme" content="#0E6E52">
<meta property="og:type" content="website">
<meta property="og:title" id="ogTitle" content="Tienda online">
<meta property="og:description" id="ogDesc" content="Hacé tu pedido online y envialo por WhatsApp.">
<meta property="og:image" id="ogImage" content="">
<link rel="icon" id="favicon" href="ventra-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#0E6E52;
    --brand-soft:color-mix(in srgb, var(--brand) 10%, #fff);
    --brand-soft-2:color-mix(in srgb, var(--brand) 18%, #fff);
    --brand-ink:color-mix(in srgb, var(--brand) 70%, #000);
    --bg:#F6F7F5; --surface:#fff; --line:#E7E9E6; --line-2:#EFF1EE;
    --ink:#101512; --ink-2:#5C6660; --ink-3:#8E9791;
    --ok:#15803D; --warn:#B45309; --bad:#B91C1C;
    --r-lg:22px; --r-md:16px; --r-sm:12px;
    --shadow:0 1px 2px rgba(16,21,18,.04), 0 8px 24px -12px rgba(16,21,18,.14);
    --shadow-up:0 -8px 30px -10px rgba(16,21,18,.25);
    --safe-b:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
  input,textarea{font:inherit;color:inherit}
  img{display:block;max-width:100%}
  .display{font-family:'Plus Jakarta Sans','Inter',sans-serif;letter-spacing:-.02em}
  .wrap{max-width:1120px;margin:0 auto;padding:0 16px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

  /* Estados */
  .center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
  .spin{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Barra superior */
  .announce{background:var(--brand);color:#fff;text-align:center;font-size:13px;font-weight:600;padding:9px 16px}
  .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
  .topbar.scrolled{border-bottom-color:var(--line)}
  .topbar .wrap{height:60px;display:flex;align-items:center;gap:12px}
  .tb-logo{width:36px;height:36px;border-radius:10px;object-fit:cover;background:var(--brand);opacity:0;transform:translateY(4px);transition:.2s}
  .tb-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(4px);transition:.2s}
  .topbar.scrolled .tb-logo,.topbar.scrolled .tb-name{opacity:1;transform:none}
  .tb-actions{margin-left:auto;display:flex;gap:8px}
  .icon-btn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);position:relative;transition:transform .15s}
  .icon-btn:active{transform:scale(.94)}
  .badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}

  /* Portada */
  .hero{position:relative}
  .hero-cover{aspect-ratio:3/1;background:var(--brand);overflow:hidden;position:relative}
  .hero-cover img{width:100%;height:100%;object-fit:cover}
  .hero-cover .pattern{position:absolute;inset:0;opacity:.12;background-image:radial-gradient(#fff 1.2px,transparent 1.2px);background-size:18px 18px}
  @media(min-width:760px){.hero-cover{border-radius:0 0 28px 28px}}
  .hero-card{position:relative;margin-top:14px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center}
  .hero-logo{grid-row:span 2;width:84px;height:84px;border-radius:20px;object-fit:cover;background:var(--brand);border:4px solid #fff;box-shadow:0 6px 18px -8px rgba(0,0,0,.35);margin-top:-44px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:34px}
  .hero-name{margin:0;font-size:24px;font-weight:800;line-height:1.1}
  .hero-desc{margin:0;color:var(--ink-2);font-size:14px}
  .hero-meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--line-2);font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
  .chip svg.i{width:16px;height:16px}
  .chip.open{background:#E8F6EC;color:var(--ok)}
  .chip.closed{background:#FDEEEE;color:var(--bad)}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
  .hero-actions{grid-column:1/-1;display:flex;gap:8px;margin-top:12px}
  .btn{height:44px;padding:0 16px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;transition:transform .15s,background .15s}
  .btn:active{transform:scale(.97)}
  a.btn{text-decoration:none}
  [hidden]{display:none!important}
  .btn-brand{background:var(--brand);color:#fff}
  .btn-soft{background:var(--brand-soft);color:var(--brand-ink)}
  .btn-ghost{background:var(--surface);border:1px solid var(--line)}
  .btn-wa{background:#1FAF55;color:#fff}
  .btn-block{width:100%;height:54px;border-radius:16px;font-size:16px}
  .btn[disabled]{opacity:.45;pointer-events:none}
  @media(min-width:760px){
    .hero-card{padding:22px 26px;grid-template-columns:auto 1fr auto}
    .hero-logo{width:104px;height:104px;margin-top:-60px}
    .hero-name{font-size:30px}
    .hero-actions{grid-column:3;grid-row:1/span 2;margin:0}
  }

  /* Buscador y categorías */
  .toolbar{position:sticky;top:60px;z-index:20;background:var(--bg);padding:14px 0 10px}
  .search{position:relative}
  .search svg.i{position:absolute;left:14px;top:0;bottom:0;margin:auto;color:var(--ink-3)}
  .search input{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 44px;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
  .search input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
  .search .clear{position:absolute;right:8px;top:0;bottom:0;margin:auto;width:32px;height:32px;border-radius:50%;display:none;align-items:center;justify-content:center;color:var(--ink-3)}
  .search.has .clear{display:flex}
  .cats{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cat{flex-shrink:0;height:36px;padding:0 15px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:.15s}
  .cat.on{background:var(--ink);border-color:var(--ink);color:#fff}

  /* Productos */
  main{padding-bottom:36px}
  .section{padding-top:18px;scroll-margin-top:170px}
  .section h2{margin:0 0 12px;font-size:19px;font-weight:800;display:flex;align-items:baseline;gap:8px}
  .section h2 small{font:600 13px 'Inter';color:var(--ink-3)}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(min-width:960px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}}
  .card{background:var(--surface);border-radius:var(--r-md);border:1px solid var(--line-2);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s;position:relative}
  @media(hover:hover){.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}}
  .card-img{aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;border-bottom:1px solid var(--line-2)}
  .card-img img{width:100%;height:100%;object-fit:contain;padding:10px}
  .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--brand-soft);color:var(--brand);font:800 40px 'Plus Jakarta Sans',sans-serif}
  .card-body{padding:10px 12px 12px;display:flex;flex-direction:column;flex:1;gap:2px}
  .card-brand{font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-name{margin:0;font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;cursor:pointer}
  .card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px}
  .price{font:800 17px 'Plus Jakarta Sans',sans-serif;letter-spacing:-.02em}
  .price small{font:600 11.5px 'Inter';color:var(--ink-3)}
  .add{width:38px;height:38px;border-radius:12px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;transition:transform .15s}
  .add:active{transform:scale(.9)}
  .stepper{display:flex;align-items:center;background:var(--brand);color:#fff;border-radius:12px;height:38px;overflow:hidden}
  .stepper button{width:34px;height:38px;display:flex;align-items:center;justify-content:center}
  .stepper span{min-width:22px;text-align:center;font-weight:700;font-size:14px}
  .stepper svg.i{width:18px;height:18px}
  .card.out .card-img img,.card.out .ph{filter:grayscale(1);opacity:.5}
  .tag-out{position:absolute;top:10px;left:10px;background:rgba(16,21,18,.78);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:8px}
  .empty{text-align:center;padding:60px 20px;color:var(--ink-2)}
  .empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

  /* Barra del carrito */
  .cartbar{position:fixed;left:0;right:0;bottom:0;z-index:35;padding:12px 16px calc(12px + var(--safe-b));pointer-events:none;transform:translateY(120%);transition:transform .3s cubic-bezier(.2,.9,.3,1.2)}
  .cartbar.show{transform:none}
  .cartbar button{pointer-events:auto;max-width:560px;margin:0 auto;width:100%;height:60px;border-radius:18px;background:var(--brand);color:#fff;display:flex;align-items:center;gap:12px;padding:0 10px 0 18px;box-shadow:0 14px 34px -10px color-mix(in srgb,var(--brand) 60%,transparent)}
  .cb-count{min-width:30px;height:30px;padding:0 8px;border-radius:10px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:800}
  .cb-label{font-weight:700;font-size:15px}
  .cb-total{margin-left:auto;background:#fff;color:var(--brand-ink);height:42px;padding:0 14px;border-radius:13px;display:flex;align-items:center;font:800 16px 'Plus Jakarta Sans',sans-serif}

  /* Hojas (producto y carrito) */
  .scrim{position:fixed;inset:0;background:rgba(10,14,12,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;z-index:60;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;background:var(--surface);border-radius:26px 26px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);box-shadow:var(--shadow-up)}
  .sheet.show{transform:none}
  @media(min-width:760px){
    .sheet{left:50%;right:auto;bottom:auto;top:50%;width:520px;max-height:86vh;border-radius:26px;transform:translate(-50%,-46%) scale(.97);opacity:0;transition:transform .25s,opacity .25s;pointer-events:none}
    .sheet.show{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
    .sheet.side{top:0;bottom:0;right:0;left:auto;width:440px;max-height:none;border-radius:26px 0 0 26px;transform:translateX(100%);opacity:1}
    .sheet.side.show{transform:none}
  }
  .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0;flex-shrink:0}
  @media(min-width:760px){.grab{display:none}}
  .sheet-head{display:flex;align-items:center;gap:10px;padding:12px 18px 8px;flex-shrink:0}
  .sheet-head h3{margin:0;font-size:19px;font-weight:800;flex:1}
  .sheet-close{width:36px;height:36px;border-radius:50%;background:var(--line-2);display:flex;align-items:center;justify-content:center}
  .sheet-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 18px 16px}
  .sheet-foot{flex-shrink:0;padding:12px 18px calc(14px + var(--safe-b));border-top:1px solid var(--line-2)}

  .pd-img{aspect-ratio:1.25;background:#fff;border-radius:18px;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .pd-img img{width:100%;height:100%;object-fit:contain;padding:16px}
  .pd-name{margin:14px 0 4px;font-size:21px;font-weight:800;line-height:1.2}
  .pd-desc{color:var(--ink-2);font-size:14.5px;margin:8px 0 0;white-space:pre-line}
  .pd-price{font:800 26px 'Plus Jakarta Sans',sans-serif;letter-spacing:-.02em;margin-top:6px}
  .qty-big{display:flex;align-items:center;gap:6px;background:var(--line-2);border-radius:16px;height:54px;padding:0 6px}
  .qty-big button{width:42px;height:42px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .qty-big span{min-width:28px;text-align:center;font-weight:800;font-size:17px}

  .line{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2);align-items:center}
  .line:last-child{border-bottom:0}
  .line-img{width:58px;height:58px;border-radius:14px;background:#fff;border:1px solid var(--line-2);overflow:hidden;flex-shrink:0}
  .line-img img{width:100%;height:100%;object-fit:contain;padding:4px}
  .line-img .ph{font-size:22px}
  .line-info{flex:1;min-width:0}
  .line-name{margin:0;font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .line-price{font-size:13px;color:var(--ink-2);margin-top:2px}
  .line .stepper{background:var(--line-2);color:var(--ink);height:36px}
  .line .stepper button{height:36px;width:32px}
  .sum{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2);padding:3px 0}
  .sum.total{color:var(--ink);font-weight:800;font-size:18px;padding-top:8px}
  .note{background:#FFF7E8;color:#8A4B0A;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:10px}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
  .field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:15px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
  .field textarea{min-height:76px;resize:vertical}
  .field input:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
  .field .err{color:var(--bad);font-size:12.5px;margin-top:5px;display:none}
  .field.invalid input{border-color:var(--bad)}
  .field.invalid .err{display:block}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .opt{border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:left;background:#fff;transition:.15s}
  .opt b{display:block;font-size:14px}
  .opt small{color:var(--ink-3);font-size:12.5px}
  .opt.on{border-color:var(--brand);background:var(--brand-soft)}
  .pills{display:flex;flex-wrap:wrap;gap:8px}
  .pill{height:40px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px;transition:.15s}
  .pill.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
  .alias{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--line-2);border-radius:12px;padding:10px 12px;font-size:13.5px}
  .alias b{font-family:ui-monospace,monospace;font-size:14px}

  .done{text-align:center;padding:10px 0 4px}
  .done-ic{width:84px;height:84px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;margin:6px auto 16px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  .done-ic svg.i{width:42px;height:42px;stroke-width:3}
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
  .done h3{margin:0;font-size:22px;font-weight:800}
  .done p{color:var(--ink-2);margin:6px 0 0}
  .code{display:inline-block;margin-top:12px;background:var(--line-2);border-radius:10px;padding:6px 12px;font:700 15px ui-monospace,monospace;letter-spacing:.08em}

  /* Pie */
  footer{background:var(--surface);border-top:1px solid var(--line);padding:28px 0 calc(28px + var(--safe-b));font-size:14px;color:var(--ink-2)}
  body:has(.cartbar.show) footer{padding-bottom:calc(104px + var(--safe-b))}
  .f-grid{display:grid;gap:22px}
  @media(min-width:760px){.f-grid{grid-template-columns:1fr 1fr;gap:40px;align-items:start}}
  .f-brand{display:flex;gap:14px;align-items:center}
  .f-logo{width:52px;height:52px;border-radius:15px;object-fit:cover;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font:800 22px 'Plus Jakarta Sans',sans-serif;flex-shrink:0;box-shadow:0 4px 14px -8px rgba(0,0,0,.35)}
  .f-name{margin:0;font-size:18px;font-weight:800;color:var(--ink);line-height:1.2}
  .f-desc{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
  .f-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:16px}
  .f-actions .btn{height:48px;width:100%}
  .btn-ig{background:linear-gradient(45deg,#F58529,#DD2A7B 55%,#8134AF);color:#fff}
  .f-addr{display:flex;gap:8px;align-items:flex-start;margin-top:14px;color:var(--ink-2);text-decoration:none;font-size:13.5px}
  .f-addr svg.i{width:18px;height:18px;margin-top:1px;color:var(--brand)}
  .f-addr span{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
  .hours{background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r-md);padding:14px 14px 8px}
  .hours-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  .hours-head h4{margin:0;display:flex;align-items:center;gap:7px;font-size:15px;color:var(--ink)}
  .hours-head h4 svg.i{width:18px;height:18px;color:var(--brand)}
  .hours-head .chip{height:28px;font-size:12px;padding:0 10px}
  .hours-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:8px 10px;margin:0 -6px;border-radius:10px;font-size:14px}
  .hours-row + .hours-row{border-top:1px solid var(--line-2)}
  .hours-row .h-day{color:var(--ink);font-weight:600}
  .hours-row .h-times{text-align:right;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:2px}
  .hours-row .h-closed{color:var(--ink-3)}
  .hours-row.today{background:var(--brand-soft);border-top-color:transparent}
  .hours-row.today + .hours-row{border-top-color:transparent}
  .hours-row.today .h-day,.hours-row.today .h-times{color:var(--brand-ink);font-weight:700}
  .hours-row.today .h-day small{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;background:var(--brand);color:#fff;border-radius:6px;padding:1px 6px;vertical-align:1px}
  .made{margin-top:26px;padding-top:18px;border-top:1px solid var(--line-2);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 14px;font-size:12.5px;color:var(--ink-3)}
  .made a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .made img{width:18px;height:18px;border-radius:5px}
  .made b{color:var(--ink-2)}
  .made .cta{color:var(--brand);font-weight:700}

<script>
firebase.initializeApp({

});
var db = firebase.firestore();

/* ───────── utilidades ───────── */
var DAYS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var DAYS_CAP = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function money(n){ return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n||0); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function ic(name,cls){ return '<svg class="i '+(cls||'')+'" aria-hidden="true"><use href="#i-'+name+'"/></svg>'; }
function $(sel,root){ return (root||document).querySelector(sel); }
function initial(name){ var ch=(String(name||'').trim()[0]||'').toUpperCase(); return /[A-Z0-9ÁÉÍÓÚÑÜ]/.test(ch)?ch:'•'; }
function imgOrPh(url,name){
  return url ? '<img src="'+esc(url)+'" alt="" loading="lazy" decoding="async" onerror="this.outerHTML=\'<div class=ph>'+initial(name)+'</div>\'">'
             : '<div class="ph">'+initial(name)+'</div>';

function unitLabel(u){ return u==='KG'?'/kg':u==='L'?'/l':u==='MT'?'/m':''; }

function normalize(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

var S = {

};

/* ───────── horarios ───────── */
function toMin(hhmm){ var p=String(hhmm||'0:0').split(':'); return (+p[0])*60+(+p[1]||0); }
/* Cada día puede tener varios turnos (ej. 9 a 13 y 17 a 21). Las tiendas viejas solo tienen from/to. */
function dayRanges(h){
  if(!h||!h.open) return [];
  var r=(h.ranges&&h.ranges.length)?h.ranges:[{from:h.from,to:h.to}];
  return mergeRanges(r.filter(function(x){return x&&x.from&&x.to;}));
}
/* Junta los turnos repetidos o que se pisan (9 a 20 y 17 a 21 = 9 a 21). Los que pasan la medianoche quedan aparte. */
function mergeRanges(list){
  var day=[], night=[];
  list.forEach(function(x){ (toMin(x.to)>toMin(x.from)?day:night).push({from:x.from,to:x.to}); });
  day.sort(function(a,b){return toMin(a.from)-toMin(b.from);});
  var out=[];
  day.forEach(function(x){
    var last=out[out.length-1];
    if(last && toMin(x.from)<=toMin(last.to)){ if(toMin(x.to)>toMin(last.to)) last.to=x.to; }
    else out.push(x);
  });
  night.forEach(function(x){ if(!out.some(function(o){return o.from===x.from&&o.to===x.to;})) out.push(x); });
  return out;
}
function openStatus(hours){
  if(!hours || !hours.length) return null;
  var now=new Date(), d=now.getDay(), m=now.getHours()*60+now.getMinutes(), today=dayRanges(hours[d]);
  for(var i=0;i<today.length;i++){
    if(m>=toMin(today[i].from) && m<toMin(today[i].to)) return {open:true,text:'Abierto · cierra '+today[i].to};
  }
  for(var j=0;j<today.length;j++){
    if(m<toMin(today[j].from)) return {open:false,text:(j>0?'Cerrado · vuelve a abrir ':'Cerrado · abre hoy ')+today[j].from};
  }
  for(var k=1;k<8;k++){
    var dd=(d+k)%7, r=dayRanges(hours[dd]);
    if(!r.length) continue;
    return {open:false,text:k===1?'Cerrado · abre mañana '+r[0].from:'Cerrado · abre el '+DAYS[dd]+' '+r[0].from};
  }
  return {open:false,text:'Cerrado'};
}

/* ───────── carrito ───────── */
function cartKey(){ return 'ventra_cart_v2_'+S.storeId; }
function loadCart(){
  try{
    var raw=JSON.parse(localStorage.getItem(cartKey())||'{}'), out={};
    Object.keys(raw).forEach(function(id){ if(S.byId[id] && S.byId[id].inStock!==false && raw[id]>0) out[id]=raw[id]; });
    return out;
  }catch(e){ return {}; }
}
function saveCart(){ try{ localStorage.setItem(cartKey(),JSON.stringify(S.cart)); }catch(e){} }
function cartItems(){ return Object.keys(S.cart).map(function(id){ return {p:S.byId[id],qty:S.cart[id]}; }).filter(function(x){return x.p;}); }
function cartCount(){ return cartItems().reduce(function(a,x){return a+x.qty;},0); }
function subtotal(){ return cartItems().reduce(function(a,x){return a+x.qty*x.p.price;},0); }
function deliveryCost(){
  var c=S.cfg; if(S.delivery!=='DELIVERY') return 0;
  var sub=subtotal();
  if(c.freeDeliveryFrom>0 && sub>=c.freeDeliveryFrom) return 0;
  return c.deliveryCost||0;
}
function setQty(id,qty){
  if(qty<=0) delete S.cart[id]; else S.cart[id]=qty;
  saveCart(); refreshProduct(id); refreshCartBar();
  if($('#cartSheet').classList.contains('show') && S.step==='cart') renderCartSheet();
}

/* ───────── arranque ───────── */
async function init(){
  var slug=decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g,''));
  if(!slug){ return notFound('Tiendas online de Ventra','Para ver una tienda, entrá con el enlace que te compartió el comercio.'); }
  try{
    var snap=await db.collection('ventra_stores').where('claimed','==',true).where('subdomain','==',slug).limit(1).get();
    if(snap.empty) return notFound('No encontramos esta tienda','Revisá que el enlace esté bien escrito.');
    var doc=snap.docs[0], cfg=doc.data();
    if(!cfg.isPublished) return notFound('Tienda en preparación','El comercio todavía no la publicó. Volvé a entrar en un rato.');
    S.storeId=doc.id; S.cfg=cfg;
    cfg.pickupEnabled = cfg.pickupEnabled!==false;
    cfg.paymentMethods = (cfg.paymentMethods&&cfg.paymentMethods.length)?cfg.paymentMethods:['Efectivo','Transferencia'];
    applyBrand(cfg);

    var ps=await db.collection('ventra_stores').doc(doc.id).collection('products').get();
    var list=ps.docs.map(function(d){ var x=d.data(); x.id=d.id; x._q=normalize(x.name+' '+(x.brand||'')+' '+(x.category||'')); return x; });
    // Opción de la tienda: vender todo aunque en el sistema figure sin stock
    if(cfg.alwaysInStock) list.forEach(function(p){ p.inStock=true; });
    if(cfg.showOutOfStock===false) list=list.filter(function(p){return p.inStock!==false;});
    list.sort(function(a,b){ return (b.inStock!==false)-(a.inStock!==false) || String(a.name).localeCompare(String(b.name),'es'); });
    S.products=list;
    list.forEach(function(p){ S.byId[p.id]=p; });
    var cs={}; list.forEach(function(p){ var c=p.category||'Otros'; cs[c]=(cs[c]||0)+1; });
    S.cats=Object.keys(cs).sort(function(a,b){ return a==='Varios'||a==='Otros'?1:b==='Varios'||b==='Otros'?-1:a.localeCompare(b,'es'); });
    S.cart=loadCart();
    S.delivery = cfg.pickupEnabled ? 'PICKUP' : (cfg.deliveryEnabled ? 'DELIVERY' : (cfg.goDeliveryEnabled ? 'GODELIVERY' : null));
    render();
  }catch(err){
    console.error(err);
    notFound('No pudimos cargar la tienda','Revisá tu conexión e intentá de nuevo en unos minutos.');
  }
}

function applyBrand(cfg){
  var brand=/^#[0-9a-f]{6}$/i.test(cfg.primaryColor||'')?cfg.primaryColor:'#0E6E52';
  document.documentElement.style.setProperty('--brand',brand);
  $('#metaTheme').setAttribute('content',brand);
  var title=cfg.businessName+' · Pedí online';
  document.title=title; $('#ogTitle').setAttribute('content',title);
  var desc=cfg.description||('Mirá el catálogo de '+cfg.businessName+' y hacé tu pedido por WhatsApp.');
  $('#metaDesc').setAttribute('content',desc); $('#ogDesc').setAttribute('content',desc);
  if(cfg.bannerUrl||cfg.logoUrl) $('#ogImage').setAttribute('content',cfg.bannerUrl||cfg.logoUrl);
  if(cfg.logoUrl) $('#favicon').setAttribute('href',cfg.logoUrl);
}

function notFound(title,text){

}

function render(){

    + '<div class="tb-actions">'

    + '</div></div></div>';

  h+='<section class="hero"><div class="hero-cover">'+(c.bannerUrl?'<img src="'+esc(c.bannerUrl)+'" alt="">':'<div class="pattern"></div>')+'</div>'
    +'<div class="wrap"><div class="hero-card">'
    + (c.logoUrl?'<img class="hero-logo" src="'+esc(c.logoUrl)+'" alt="Logo de '+esc(c.businessName)+'">':'<div class="hero-logo">'+initial(c.businessName)+'</div>')
    + '<h1 class="hero-name display">'+esc(c.businessName)+'</h1>'
    + '<p class="hero-desc">'+esc(c.description||'Hacé tu pedido y te lo confirmamos por WhatsApp.')+'</p>'
    + '<div class="hero-meta">'
    +   (st?'<span class="chip '+(st.open?'open':'closed')+'"><span class="dot"></span>'+esc(st.text)+'</span>':'')
    +   (c.deliveryEnabled?'<span class="chip">'+ic('truck')+(c.deliveryCost>0?'Envío '+money(c.deliveryCost):'Envío sin cargo')+(c.freeDeliveryFrom>0&&c.deliveryCost>0?' · gratis desde '+money(c.freeDeliveryFrom):'')+'</span>':'')
    +   (c.goDeliveryEnabled?'<span class="chip">'+ic('truck')+'Envíos con GoDelivery</span>':'')
    +   (c.pickupEnabled?'<span class="chip">'+ic('store')+'Retiro en el local</span>':'')
    +   (c.minOrder>0?'<span class="chip">Pedido mínimo '+money(c.minOrder)+'</span>':'')
    + '</div>'
    + '<div class="hero-actions">'

    +   '<button class="btn btn-ghost" data-act="share">'+ic('share')+'Compartir</button>'
    + '</div>'
    +'</div></div></section>';

  h+='<div class="toolbar"><div class="wrap">'
    +'<div class="search'+(S.q?' has':'')+'" id="searchBox">'+ic('search')
    +'<label class="sr" for="q">Buscar productos</label><input id="q" type="search" placeholder="Buscar en '+esc(c.businessName)+'" value="'+esc(S.q)+'" autocomplete="off" enterkeyhint="search">'
    +'<button class="clear" data-act="clear-search" aria-label="Borrar búsqueda">'+ic('x')+'</button></div>'
    + (S.cats.length>1?'<div class="cats" id="cats" role="tablist">'+['ALL'].concat(S.cats).map(function(ct){
        return '<button class="cat'+(S.cat===ct?' on':'')+'" data-act="cat" data-cat="'+esc(ct)+'" role="tab">'+(ct==='ALL'?'Todo':esc(ct))+'</button>';
      }).join('')+'</div>':'')
    +'</div></div>';

  h+='<main><div class="wrap" id="list"></div></main>';
  h+=footerHtml();
  h+='<div class="cartbar" id="cartbar"><button data-act="open-cart"><span class="cb-count" id="cbCount"></span><span class="cb-label">Ver pedido</span><span class="cb-total" id="cbTotal"></span></button></div>';
  h+='<div class="scrim" id="scrim" data-act="close"></div>';
  h+='<div class="sheet" id="productSheet" role="dialog" aria-modal="true"></div>';
  h+='<div class="sheet side" id="cartSheet" role="dialog" aria-modal="true"></div>';
  $('#app').innerHTML=h;

  renderList(); refreshCartBar();
  var q=$('#q');
  q.addEventListener('input',function(){ S.q=q.value; $('#searchBox').classList.toggle('has',!!S.q); renderList(); });
  var tb=$('#topbar');
  var onScroll=function(){ tb.classList.toggle('scrolled',window.scrollY>200); };
  window.addEventListener('scroll',onScroll,{passive:true}); onScroll();
}

function productCard(p){
  var qty=S.cart[p.id]||0, out=p.inStock===false;
  return '<article class="card'+(out?' out':'')+'" id="p-'+esc(p.id)+'">'
    + (out?'<span class="tag-out">Agotado</span>':'')
    + '<div class="card-img" data-act="product" data-id="'+esc(p.id)+'">'+imgOrPh(p.imageUrl,p.name)+'</div>'
    + '<div class="card-body">'
    +   (p.brand?'<span class="card-brand">'+esc(p.brand)+'</span>':'')
    +   '<h3 class="card-name" data-act="product" data-id="'+esc(p.id)+'">'+esc(p.name)+'</h3>'
    +   '<div class="card-foot"><span class="price">'+money(p.price)+'<small>'+unitLabel(p.unit)+'</small></span>'+buyControl(p.id,qty,out)+'</div>'
    + '</div></article>';
}
function buyControl(id,qty,out){
  if(out) return '';
  if(!qty) return '<button class="add" data-act="add" data-id="'+esc(id)+'" aria-label="Agregar">'+ic('plus')+'</button>';
  return '<div class="stepper"><button data-act="dec" data-id="'+esc(id)+'" aria-label="Quitar uno">'+ic(qty===1?'trash':'minus')+'</button><span>'+qty+'</span><button data-act="inc" data-id="'+esc(id)+'" aria-label="Agregar uno">'+ic('plus')+'</button></div>';
}
function refreshProduct(id){
  var card=document.getElementById('p-'+id), p=S.byId[id];
  if(card && p){ var foot=card.querySelector('.card-foot'); foot.innerHTML='<span class="price">'+money(p.price)+'<small>'+unitLabel(p.unit)+'</small></span>'+buyControl(id,S.cart[id]||0,p.inStock===false); }
  if($('#productSheet').classList.contains('show') && S.openProduct===id) renderProductSheet(id);
}

function renderList(){
  var box=$('#list'), q=normalize(S.q.trim()), html='';
  if(!S.products.length){ box.innerHTML='<div class="empty"><b>Pronto vas a ver los productos acá</b>El comercio está cargando su catálogo.</div>'; return; }
  if(q){
    var terms=q.split(/\s+/);
    var found=S.products.filter(function(p){ return terms.every(function(t){return p._q.indexOf(t)>=0;}); });
    html='<div class="section"><h2 class="display">Resultados <small>'+found.length+'</small></h2>'
      +(found.length?'<div class="grid">'+found.slice(0,200).map(productCard).join('')+'</div>':'<div class="empty"><b>No encontramos “'+esc(S.q)+'”</b>Probá con otra palabra o escribinos por WhatsApp.</div>')+'</div>';
  } else {
    var cats=S.cat==='ALL'?S.cats:[S.cat];
    cats.forEach(function(ct){
      var items=S.products.filter(function(p){ return (p.category||'Otros')===ct; });
      if(!items.length) return;
      html+='<section class="section" data-cat-section="'+esc(ct)+'"><h2 class="display">'+esc(ct)+' <small>'+items.length+'</small></h2><div class="grid">'+items.map(productCard).join('')+'</div></section>';
    });
  }
  box.innerHTML=html;
}

var DAYS_SHORT=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
/* Horarios agrupados: los días seguidos con el mismo horario van en una sola línea (Lun a Vie). */
function hoursHtml(c,st){
  if(!c.hours || !c.hours.length) return '';
  var today=new Date().getDay(), groups=[];
  [1,2,3,4,5,6,0].forEach(function(i){
    var r=dayRanges(c.hours[i]), key=r.map(function(x){return x.from+'-'+x.to;}).join('|');
    var g=groups[groups.length-1];
    if(g && g.key===key) g.days.push(i); else groups.push({key:key,ranges:r,days:[i]});
  });
  var rows=groups.map(function(g){
    var n=g.days.length, first=g.days[0], last=g.days[n-1];
    var label=n===7?'Todos los días':n===1?DAYS_CAP[first]:n===2?DAYS_SHORT[first]+' y '+DAYS_SHORT[last]:DAYS_SHORT[first]+' a '+DAYS_SHORT[last];
    var isToday=g.days.indexOf(today)>=0;
    return '<div class="hours-row'+(isToday?' today':'')+'"><span class="h-day">'+label+(isToday?'<small>Hoy</small>':'')+'</span>'
      +'<span class="h-times">'+(g.ranges.length?g.ranges.map(function(x){return '<span>'+esc(x.from)+' – '+esc(x.to)+'</span>';}).join(''):'<span class="h-closed">Cerrado</span>')+'</span></div>';
  }).join('');
  return '<div class="hours"><div class="hours-head"><h4>'+ic('clock')+'Horarios</h4>'
    +(st?'<span class="chip '+(st.open?'open':'closed')+'"><span class="dot"></span>'+(st.open?'Abierto ahora':'Cerrado ahora')+'</span>':'')
    +'</div>'+rows+'</div>';
}
function footerHtml(){
  var c=S.cfg, st=openStatus(c.hours);
  var ig=(c.instagram||'').replace(/^@/,'').trim();
  var wa=String(c.whatsappNumber||'').replace(/\D/g,'');
  var actions=(wa?'<a class="btn btn-wa" href="https://wa.me/'+esc(wa)+'" target="_blank" rel="noopener">'+ic('wa')+'WhatsApp</a>':'')
    +(ig?'<a class="btn btn-ig" href="https://instagram.com/'+encodeURIComponent(ig)+'" target="_blank" rel="noopener">'+ic('ig')+'Instagram</a>':'');
  return '<footer><div class="wrap"><div class="f-grid">'
    +'<div>'
    +  '<div class="f-brand">'+(c.logoUrl?'<img class="f-logo" src="'+esc(c.logoUrl)+'" alt="">':'<div class="f-logo">'+initial(c.businessName)+'</div>')
    +    '<div><h4 class="f-name display">'+esc(c.businessName)+'</h4>'+(c.description?'<p class="f-desc">'+esc(c.description)+'</p>':'')+'</div></div>'
    +  (actions?'<div class="f-actions">'+actions+'</div>':'')
    +  (c.address?'<a class="f-addr" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c.address)+'" target="_blank" rel="noopener">'+ic('pin')+'<span>'+esc(c.address)+'</span></a>':'')
    +'</div>'
    + hoursHtml(c,st)
    +'</div>'
    +'<div class="made"><a href="https://ventra.store" target="_blank" rel="noopener"><img src="ventra-logo.png" alt="">Tienda hecha con <b>Ventra</b></a>'
    +'<a class="cta" href="https://ventra.store" target="_blank" rel="noopener">¿Tenés un negocio? Creá tu tienda</a></div>'
    +'</div></footer>';
}

function refreshCartBar(){
  var n=cartCount(), bar=$('#cartbar'), b=$('#tbBadge');
  if(!bar) return;
  bar.classList.toggle('show',n>0);
  $('#cbCount').textContent=n; $('#cbTotal').textContent=money(subtotal());
  b.hidden=!n; b.textContent=n;
}

/* ───────── hojas ───────── */
function openSheet(id){ $('#scrim').classList.add('show'); $('#'+id).classList.add('show'); document.body.style.overflow='hidden'; }
function closeSheets(){ $('#scrim').classList.remove('show'); document.querySelectorAll('.sheet.show').forEach(function(s){s.classList.remove('show');}); document.body.style.overflow=''; S.openProduct=null; }

function renderProductSheet(id){
  var p=S.byId[id], qty=S.cart[id]||0, out=p.inStock===false;
  S.pdQty = S.pdQty || 1;
  $('#productSheet').innerHTML='<div class="grab"></div>'
    +'<div class="sheet-head"><h3></h3><button class="sheet-close" data-act="close" aria-label="Cerrar">'+ic('x')+'</button></div>'
    +'<div class="sheet-body"><div class="pd-img">'+imgOrPh(p.imageUrl,p.name)+'</div>'
    +(p.brand?'<div class="card-brand" style="margin-top:14px">'+esc(p.brand)+'</div>':'')
    +'<h2 class="pd-name display" style="'+(p.brand?'margin-top:2px':'')+'">'+esc(p.name)+'</h2>'
    +'<div class="pd-price">'+money(p.price)+'<small style="font:600 13px Inter;color:var(--ink-3)"> '+unitLabel(p.unit)+'</small></div>'
    +(p.description?'<p class="pd-desc">'+esc(p.description)+'</p>':'')
    +(qty?'<p class="pd-desc" style="color:var(--brand-ink);font-weight:600">Ya tenés '+qty+' en tu pedido.</p>':'')
    +'</div>'
    +'<div class="sheet-foot" style="display:flex;gap:10px">'
    +(out?'<button class="btn btn-block" disabled>Agotado</button>'
      :'<div class="qty-big"><button data-act="pd-dec" aria-label="Menos">'+ic('minus')+'</button><span>'+S.pdQty+'</span><button data-act="pd-inc" aria-label="Más">'+ic('plus')+'</button></div>'
       +'<button class="btn btn-brand btn-block" style="flex:1" data-act="pd-add">Agregar '+money(p.price*S.pdQty)+'</button>')
    +'</div>';
}

function renderCartSheet(){
  var el=$('#cartSheet'), c=S.cfg;
  if(S.step==='done') return renderDone();
  if(S.step==='checkout') return renderCheckout();
  var items=cartItems(), sub=subtotal(), body='';
  if(!items.length){
    body='<div class="empty"><b>Tu pedido está vacío</b>Agregá productos para armarlo.</div>';
  } else {
    body=items.map(function(x){
      return '<div class="line"><div class="line-img">'+imgOrPh(x.p.imageUrl,x.p.name)+'</div>'
        +'<div class="line-info"><p class="line-name">'+esc(x.p.name)+'</p><div class="line-price">'+money(x.p.price)+' · <b style="color:var(--ink)">'+money(x.p.price*x.qty)+'</b></div></div>'
        +'<div class="stepper"><button data-act="dec" data-id="'+esc(x.p.id)+'" aria-label="Quitar uno">'+ic(x.qty===1?'trash':'minus')+'</button><span>'+x.qty+'</span><button data-act="inc" data-id="'+esc(x.p.id)+'" aria-label="Agregar uno">'+ic('plus')+'</button></div></div>';
    }).join('');
  }
  var missing=c.minOrder>0?Math.max(0,c.minOrder-sub):0;
  el.innerHTML='<div class="grab"></div>'
    +'<div class="sheet-head"><h3 class="display">Tu pedido</h3><button class="sheet-close" data-act="close" aria-label="Cerrar">'+ic('x')+'</button></div>'
    +'<div class="sheet-body">'+body+'</div>'
    +(items.length?'<div class="sheet-foot">'
      +(missing>0?'<div class="note">El pedido mínimo es '+money(c.minOrder)+'. Te faltan '+money(missing)+'.</div>':'')
      +(c.deliveryEnabled&&c.freeDeliveryFrom>0&&c.deliveryCost>0&&sub<c.freeDeliveryFrom?'<div class="sum" style="padding-bottom:8px">Sumá '+money(c.freeDeliveryFrom-sub)+' y el envío es gratis</div>':'')
      +'<div class="sum total"><span>Subtotal</span><span>'+money(sub)+'</span></div>'
      +'<button class="btn btn-brand btn-block" style="margin-top:12px" data-act="to-checkout"'+(missing>0?' disabled':'')+'>Continuar</button></div>':'');
}

function renderCheckout(){
  var c=S.cfg, el=$('#cartSheet'), sub=subtotal(), dc=deliveryCost(), saved={};
  try{ saved=JSON.parse(localStorage.getItem('ventra_customer')||'{}'); }catch(e){}
  if(!S.payment) S.payment=c.paymentMethods[0];
  var modes=[];
  if(c.pickupEnabled) modes.push({v:'PICKUP',t:'Retiro en el local',s:'Sin cargo'});
  if(c.deliveryEnabled) modes.push({v:'DELIVERY',t:'Envío a domicilio',s:c.deliveryCost>0?money(c.deliveryCost):'Sin cargo'});
  if(c.goDeliveryEnabled) modes.push({v:'GODELIVERY',t:'Envío con GoDelivery',s:'Lo cobra GoDelivery'});
  var h='<div class="grab"></div><div class="sheet-head"><button class="sheet-close" data-act="back-cart" aria-label="Volver">'+ic('back')+'</button><h3 class="display">Tus datos</h3><button class="sheet-close" data-act="close" aria-label="Cerrar">'+ic('x')+'</button></div>'
    +'<div class="sheet-body">'
    +'<div class="field" id="f-name"><label for="cName">Nombre y apellido</label><input id="cName" autocomplete="name" value="'+esc(saved.name||'')+'" placeholder="Juana Pérez"><div class="err">Escribí tu nombre.</div></div>'
    +'<div class="field" id="f-phone"><label for="cPhone">Teléfono</label><input id="cPhone" type="tel" inputmode="tel" autocomplete="tel" value="'+esc(saved.phone||'')+'" placeholder="11 2345 6789"><div class="err">Escribí un teléfono para que te contacten.</div></div>';
  if(modes.length>1){
    h+='<div class="field"><label>¿Cómo lo recibís?</label><div class="seg"'+(modes.length>2?' style="grid-template-columns:1fr"':'')+'>'
      +modes.map(function(m){ return '<button class="opt'+(S.delivery===m.v?' on':'')+'" data-act="delivery" data-v="'+m.v+'"><b>'+m.t+'</b><small>'+esc(m.s)+'</small></button>'; }).join('')
      +'</div></div>';
  }
  if(S.delivery==='GODELIVERY'){
    h+='<div class="note">El envío lo realiza y lo cobra GoDelivery, un servicio de envíos independiente. Su costo no está incluido en este pedido.</div>';
  }
  if(S.delivery==='DELIVERY'||S.delivery==='GODELIVERY'){
    h+='<div class="field" id="f-addr"><label for="cAddr">Dirección de entrega</label><input id="cAddr" autocomplete="street-address" value="'+esc(saved.address||'')+'" placeholder="Calle, número, piso"><div class="err">Escribí la dirección.</div>'
      +(c.deliveryZone?'<div style="font-size:12.5px;color:var(--ink-3);margin-top:5px">Hacemos envíos a: '+esc(c.deliveryZone)+'</div>':'')+'</div>';
  } else if(c.address && c.pickupEnabled){
    h+='<div class="note" style="background:var(--line-2);color:var(--ink-2)">Retirás en '+esc(c.address)+'</div>';
  }
  h+='<div class="field"><label>¿Cómo pagás?</label><div class="pills">'
    + c.paymentMethods.map(function(m){ return '<button class="pill'+(S.payment===m?' on':'')+'" data-act="pay" data-v="'+esc(m)+'">'+esc(m)+'</button>'; }).join('')
    +'</div>'
    +(S.payment==='Transferencia'&&c.transferAlias?'<div class="alias"><span>Alias: <b>'+esc(c.transferAlias)+'</b></span><button class="btn btn-soft" style="height:34px;padding:0 10px" data-act="copy-alias">'+ic('copy')+'Copiar</button></div>':'')
    +'</div>'
    +'<div class="field"><label for="cNote">Aclaraciones (opcional)</label><textarea id="cNote" placeholder="Ej: tocar timbre 2B, sin cebolla, pago con $20.000…"></textarea></div>'
    +'</div>'
    +'<div class="sheet-foot">'
    +'<div class="sum"><span>Productos</span><span>'+money(sub)+'</span></div>'
    +(S.delivery==='DELIVERY'?'<div class="sum"><span>Envío</span><span>'+(dc?money(dc):'Gratis')+'</span></div>':'')
    +(S.delivery==='GODELIVERY'?'<div class="sum"><span>Envío</span><span>Lo cobra GoDelivery</span></div>':'')
    +'<div class="sum total"><span>Total</span><span>'+money(sub+dc)+'</span></div>'
    +'<button class="btn btn-wa btn-block" style="margin-top:12px" data-act="send">'+ic('wa')+'Enviar pedido por WhatsApp</button></div>';
  el.innerHTML=h;
}

function renderDone(){
  var o=S.lastOrder;
  $('#cartSheet').innerHTML='<div class="grab"></div><div class="sheet-head"><h3></h3><button class="sheet-close" data-act="close" aria-label="Cerrar">'+ic('x')+'</button></div>'
    +'<div class="sheet-body"><div class="done"><div class="done-ic">'+ic('check')+'</div>'
    +'<h3 class="display">¡Pedido armado!</h3>'
    +'<p>Terminá de enviarlo en WhatsApp. '+esc(S.cfg.businessName)+' te va a confirmar el pedido por ahí.</p>'
    +'<span class="code">#'+esc(o.code)+'</span></div></div>'
    +'<div class="sheet-foot"><a class="btn btn-wa btn-block" href="'+esc(o.url)+'" target="_blank" rel="noopener">'+ic('wa')+'Abrir WhatsApp</a>'
    +'<button class="btn btn-ghost btn-block" style="margin-top:8px;height:48px" data-act="new-order">Hacer otro pedido</button></div>';
}

/* ───────── envío del pedido ───────── */
function orderCode(){ var a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s=''; for(var i=0;i<4;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; }

async function sendOrder(btn){
  var c=S.cfg, name=$('#cName').value.trim(), phone=$('#cPhone').value.trim(), addrEl=$('#cAddr'), addr=addrEl?addrEl.value.trim():'', note=$('#cNote').value.trim();
  var ok=true;
  $('#f-name').classList.toggle('invalid',!name); if(!name) ok=false;
  $('#f-phone').classList.toggle('invalid',phone.replace(/\D/g,'').length<6); if(phone.replace(/\D/g,'').length<6) ok=false;
  if(addrEl){ $('#f-addr').classList.toggle('invalid',!addr); if(!addr) ok=false; }
  if(!ok){ toast('Revisá los datos marcados'); return; }
  try{ localStorage.setItem('ventra_customer',JSON.stringify({name:name,phone:phone,address:addr||undefined})); }catch(e){}

  var items=cartItems().map(function(x){ return {productId:x.p.id,name:x.p.name,price:x.p.price,qty:x.qty}; });
  var sub=subtotal(), dc=deliveryCost(), total=sub+dc, code=orderCode();
  btn.disabled=true; btn.innerHTML='<span class="spin" style="width:22px;height:22px;border-width:3px;border-color:rgba(255,255,255,.35);border-top-color:#fff"></span>';

  var base={items:items,total:total,customerName:name,customerPhone:phone,customerNote:note,status:'PENDING',syncedLocal:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()};
  var rich=Object.assign({},base,{orderCode:code,delivery:S.delivery||'PICKUP',address:addr,paymentMethod:S.payment||'',deliveryCost:dc});
  var orders=db.collection('ventra_stores').doc(S.storeId).collection('orders');
  try{ await orders.add(rich); }
  catch(e){
    // Reglas viejas: se guarda con el formato anterior y los detalles en la nota
    var extra=['#'+code, S.delivery==='DELIVERY'?'Envío a: '+addr:S.delivery==='GODELIVERY'?'Envío con GoDelivery a: '+addr:'Retira en el local', 'Paga con: '+(S.payment||'-'), note].filter(Boolean).join(' — ');
    try{ await orders.add(Object.assign({},base,{customerNote:extra.slice(0,1000)})); }catch(e2){ console.warn('El pedido se envía solo por WhatsApp',e2); }
  }

  var L=[];
  // Sin emojis: el enlace de WhatsApp los rompe en algunas PCs y celulares (salen como "?")
  L.push('Hola! Quiero hacer este pedido en *'+c.businessName+'*');
  L.push('');
  L.push('*PEDIDO #'+code+'*');
  items.forEach(function(i){ L.push('- '+i.qty+' x '+i.name+': '+money(i.price*i.qty)); });
  L.push('');
  if(S.delivery==='DELIVERY'){ L.push('Subtotal: '+money(sub)); L.push('Envio: '+(dc?money(dc):'gratis')); }
  L.push('*TOTAL: '+money(total)+'*');
  L.push('');
  L.push('*Cliente:* '+name);
  L.push('*Telefono:* '+phone);
  L.push(S.delivery==='DELIVERY'?'*Entrega:* envio a '+addr:S.delivery==='GODELIVERY'?'*Entrega:* envio con GoDelivery a '+addr+' (el envio lo cobra GoDelivery)':'*Entrega:* retiro en el local');
  if(S.payment) L.push('*Pago:* '+S.payment);
  if(note) L.push('*Nota:* '+note);
  var url='https://wa.me/'+String(c.whatsappNumber||'').replace(/\D/g,'')+'?text='+encodeURIComponent(L.join('\n'));

  S.lastOrder={code:code,url:url};
  S.cart={}; saveCart(); refreshCartBar();
  S.products.forEach(function(p){ refreshProduct(p.id); });
  S.step='done'; renderCartSheet();
  window.location.href=url;
}

/* ───────── eventos ───────── */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]'); if(!t) return;
  var act=t.getAttribute('data-act'), id=t.getAttribute('data-id');
  switch(act){
    case 'add': setQty(id,1); if(navigator.vibrate) navigator.vibrate(10); toast('Agregado al pedido'); break;
    case 'inc': setQty(id,(S.cart[id]||0)+1); break;
    case 'dec': setQty(id,(S.cart[id]||0)-1); break;
    case 'product': S.openProduct=id; S.pdQty=1; renderProductSheet(id); openSheet('productSheet'); break;
    case 'pd-inc': S.pdQty++; renderProductSheet(S.openProduct); break;
    case 'pd-dec': if(S.pdQty>1){ S.pdQty--; renderProductSheet(S.openProduct); } break;
    case 'pd-add': setQty(S.openProduct,(S.cart[S.openProduct]||0)+S.pdQty); closeSheets(); toast('Agregado al pedido'); break;
    case 'open-cart': S.step='cart'; renderCartSheet(); openSheet('cartSheet'); break;
    case 'close': closeSheets(); break;
    case 'to-checkout': S.step='checkout'; renderCartSheet(); break;
    case 'back-cart': S.step='cart'; renderCartSheet(); break;
    case 'delivery': snapshotForm(); S.delivery=t.getAttribute('data-v'); renderCartSheet(); restoreForm(); break;
    case 'pay': snapshotForm(); S.payment=t.getAttribute('data-v'); renderCartSheet(); restoreForm(); break;
    case 'copy-alias': if(navigator.clipboard) navigator.clipboard.writeText(S.cfg.transferAlias); toast('Alias copiado'); break;
    case 'send': sendOrder(t); break;
    case 'new-order': S.step='cart'; closeSheets(); break;
    case 'cat':
      S.cat=t.getAttribute('data-cat'); S.q=''; var q=$('#q'); if(q) q.value=''; $('#searchBox').classList.remove('has');
      document.querySelectorAll('.cat').forEach(function(b){ b.classList.toggle('on',b===t); });
      t.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
      renderList();
      var tbar=document.querySelector('.toolbar'); window.scrollTo({top:tbar.offsetTop-60+1,behavior:'smooth'});
      break;
    case 'clear-search': S.q=''; $('#q').value=''; $('#searchBox').classList.remove('has'); renderList(); $('#q').focus(); break;
    case 'focus-search': var tb=document.querySelector('.toolbar'); window.scrollTo({top:tb.offsetTop-60+1,behavior:'smooth'}); setTimeout(function(){ $('#q').focus(); },300); break;
    case 'share':
      if(navigator.share){ navigator.share({title:S.cfg.businessName,text:S.cfg.description||'Mirá mi tienda online',url:location.href}).catch(function(){}); }
      else if(navigator.clipboard){ navigator.clipboard.writeText(location.href); toast('Enlace copiado'); }
      break;
  }
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeSheets(); });

// Al cambiar forma de entrega o pago se vuelve a dibujar el formulario: se conservan los datos escritos
var _form={};
function snapshotForm(){ ['cName','cPhone','cAddr','cNote'].forEach(function(k){ var el=document.getElementById(k); if(el) _form[k]=el.value; }); }
function restoreForm(){ Object.keys(_form).forEach(function(k){ var el=document.getElementById(k); if(el && _form[k]!=null) el.value=_form[k]; }); }

// Arrastrar hacia abajo para cerrar las hojas en el celular
(function(){
  var startY=null, sheet=null;
  document.addEventListener('touchstart',function(e){
    var g=e.target.closest('.grab,.sheet-head'); if(!g) return;
    sheet=g.closest('.sheet'); startY=e.touches[0].clientY; sheet.style.transition='none';
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(startY==null) return; var dy=Math.max(0,e.touches[0].clientY-startY); sheet.style.transform='translateY('+dy+'px)';
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(startY==null) return; var dy=e.changedTouches[0].clientY-startY; sheet.style.transition=''; sheet.style.transform='';
    if(dy>110) closeSheets(); startY=null; sheet=null;
  });
})();

init();
</script>
