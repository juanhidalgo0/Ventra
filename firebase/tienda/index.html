<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title id="pageTitle">Tienda online</title>
<meta name="description" id="metaDesc" content="Hacé tu pedido online y envialo por WhatsApp.">
<meta name="theme-color" id="metaTheme" content="#0E6E52">
<meta property="og:type" content="website">
<meta property="og:title" id="ogTitle" content="Tienda online">
<meta property="og:description" id="ogDesc" content="Hacé tu pedido online y envialo por WhatsApp.">
<meta property="og:image" id="ogImage" content="">
<link rel="icon" id="favicon" href="ventra-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#0E6E52;
    --brand-soft:color-mix(in srgb, var(--brand) 10%, #fff);
    --brand-soft-2:color-mix(in srgb, var(--brand) 18%, #fff);
    --brand-ink:color-mix(in srgb, var(--brand) 70%, #000);
    --bg:#F6F7F5; --surface:#fff; --line:#E7E9E6; --line-2:#EFF1EE;
    --ink:#101512; --ink-2:#5C6660; --ink-3:#8E9791;
    --ok:#15803D; --warn:#B45309; --bad:#B91C1C;
    --r-lg:22px; --r-md:16px; --r-sm:12px;
    --shadow:0 1px 2px rgba(16,21,18,.04), 0 8px 24px -12px rgba(16,21,18,.14);
    --shadow-up:0 -8px 30px -10px rgba(16,21,18,.25);
    --safe-b:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
  input,textarea{font:inherit;color:inherit}
  img{display:block;max-width:100%}
  .display{font-family:'Plus Jakarta Sans','Inter',sans-serif;letter-spacing:-.02em}
  .wrap{max-width:1120px;margin:0 auto;padding:0 16px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

  /* Estados */
  .center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
  .spin{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Barra superior */
  .announce{background:var(--brand);color:#fff;text-align:center;font-size:13px;font-weight:600;padding:9px 16px}
  .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
  .topbar.scrolled{border-bottom-color:var(--line)}
  .topbar .wrap{height:60px;display:flex;align-items:center;gap:12px}
  .tb-logo{width:36px;height:36px;border-radius:10px;object-fit:cover;background:var(--brand);opacity:0;transform:translateY(4px);transition:.2s}
  .tb-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(4px);transition:.2s}
  .topbar.scrolled .tb-logo,.topbar.scrolled .tb-name{opacity:1;transform:none}
  .tb-actions{margin-left:auto;display:flex;gap:8px}
  .icon-btn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);position:relative;transition:transform .15s}
  .icon-btn:active{transform:scale(.94)}
  .badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}

  /* Portada */
  .hero{position:relative}
  .hero-cover{aspect-ratio:3/1;background:var(--brand);overflow:hidden;position:relative}
  .hero-cover img{width:100%;height:100%;object-fit:cover}
  .hero-cover .pattern{position:absolute;inset:0;opacity:.12;background-image:radial-gradient(#fff 1.2px,transparent 1.2px);background-size:18px 18px}
  @media(min-width:760px){.hero-cover{border-radius:0 0 28px 28px}}
  .hero-card{position:relative;margin-top:14px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center}
  .hero-logo{grid-row:span 2;width:84px;height:84px;border-radius:20px;object-fit:cover;background:var(--brand);border:4px solid #fff;box-shadow:0 6px 18px -8px rgba(0,0,0,.35);margin-top:-44px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:34px}
  .hero-name{margin:0;font-size:24px;font-weight:800;line-height:1.1}
  .hero-desc{margin:0;color:var(--ink-2);font-size:14px}
  .hero-meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--line-2);font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
  .chip svg.i{width:16px;height:16px}
  .chip.open{background:#E8F6EC;color:var(--ok)}
  .chip.closed{background:#FDEEEE;color:var(--bad)}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
  .hero-actions{grid-column:1/-1;display:flex;gap:8px;margin-top:12px}
  .btn{height:44px;padding:0 16px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;transition:transform .15s,background .15s}
  .btn:active{transform:scale(.97)}
  a.btn{text-decoration:none}
  [hidden]{display:none!important}
  .btn-brand{background:var(--brand);color:#fff}
  .btn-soft{background:var(--brand-soft);color:var(--brand-ink)}
  .btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
  .hero-actions{flex-wrap:wrap}
  .hero-actions .btn{white-space:nowrap}
  @media(max-width:759px){.hero-actions .btn-book{flex:1 1 100%}}
  .btn-wa{background:#1FAF55;color:#fff}
  .btn-block{width:100%;height:54px;border-radius:16px;font-size:16px}
  .btn[disabled]{opacity:.45;pointer-events:none}
  @media(min-width:760px){
    .hero-card{padding:22px 26px;grid-template-columns:auto 1fr auto}
    .hero-logo{width:104px;height:104px;margin-top:-60px}
    .hero-name{font-size:30px}
    .hero-actions{grid-column:3;grid-row:1/span 2;margin:0}
  }

  /* Buscador y categorías */
  .toolbar{position:sticky;top:60px;z-index:20;background:var(--bg);padding:14px 0 10px}
  .search{position:relative}
  .search svg.i{position:absolute;left:14px;top:0;bottom:0;margin:auto;color:var(--ink-3)}
  .search input{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 44px;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
  .search input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
  .search .clear{position:absolute;right:8px;top:0;bottom:0;margin:auto;width:32px;height:32px;border-radius:50%;display:none;align-items:center;justify-content:center;color:var(--ink-3)}
  .search.has .clear{display:flex}
  .cats{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cat{flex-shrink:0;height:36px;padding:0 15px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:.15s}
  .cat.on{background:var(--ink);border-color:var(--ink);color:#fff}

  /* Productos */
  main{padding-bottom:36px}
  .section{padding-top:18px;scroll-margin-top:170px}
  .section h2{margin:0 0 12px;font-size:19px;font-weight:800;display:flex;align-items:baseline;gap:8px}
  .section h2 small{font:600 13px 'Inter';color:var(--ink-3)}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(min-width:960px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}}
  .card{background:var(--surface);border-radius:var(--r-md);border:1px solid var(--line-2);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s;position:relative}
  @media(hover:hover){.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}}
  .card-img{aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;border-bottom:1px solid var(--line-2)}
  .card-img img{width:100%;height:100%;object-fit:contain;padding:10px}
  .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--brand-soft);color:var(--brand);font:800 40px 'Plus Jakarta Sans',sans-serif}
  .card-body{padding:10px 12px 12px;display:flex;flex-direction:column;flex:1;gap:2px}
  .card-brand{font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-name{margin:0;font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;cursor:pointer}
  .card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px}
  .price{font:800 17px 'Plus Jakarta Sans',sans-serif;letter-spacing:-.02em}
  .price small{font:600 11.5px 'Inter';color:var(--ink-3)}
  .add{width:38px;height:38px;border-radius:12px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;transition:transform .15s}
  .add:active{transform:scale(.9)}
  .stepper{display:flex;align-items:center;background:var(--brand);color:#fff;border-radius:12px;height:38px;overflow:hidden}
  .stepper button{width:34px;height:38px;display:flex;align-items:center;justify-content:center}
  .stepper span{min-width:22px;text-align:center;font-weight:700;font-size:14px}
  .stepper svg.i{width:18px;height:18px}
  .card.out .card-img img,.card.out .ph{filter:grayscale(1);opacity:.5}
  .tag-out{position:absolute;top:10px;left:10px;background:rgba(16,21,18,.78);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:8px}
  .empty{text-align:center;padding:60px 20px;color:var(--ink-2)}
  .empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

  /* Barra del carrito */
  .cartbar{position:fixed;left:0;right:0;bottom:0;z-index:35;padding:12px 16px calc(12px + var(--safe-b));pointer-events:none;transform:translateY(120%);transition:transform .3s cubic-bezier(.2,.9,.3,1.2)}
  .cartbar.show{transform:none}
  .cartbar button{pointer-events:auto;max-width:560px;margin:0 auto;width:100%;height:60px;border-radius:18px;background:var(--brand);color:#fff;display:flex;align-items:center;gap:12px;padding:0 10px 0 18px;box-shadow:0 14px 34px -10px color-mix(in srgb,var(--brand) 60%,transparent)}
  .cb-count{min-width:30px;height:30px;padding:0 8px;border-radius:10px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:800}
  .cb-label{font-weight:700;font-size:15px}
  .cb-total{margin-left:auto;background:#fff;color:var(--brand-ink);height:42px;padding:0 14px;border-radius:13px;display:flex;align-items:center;font:800 16px 'Plus Jakarta Sans',sans-serif}

  /* Hojas (producto y carrito) */
  .scrim{position:fixed;inset:0;background:rgba(10,14,12,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;z-index:60;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;background:var(--surface);border-radius:26px 26px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);box-shadow:var(--shadow-up)}
  .sheet.show{transform:none}
  @media(min-width:760px){
    .sheet{left:50%;right:auto;bottom:auto;top:50%;width:520px;max-height:86vh;border-radius:26px;transform:translate(-50%,-46%) scale(.97);opacity:0;transition:transform .25s,opacity .25s;pointer-events:none}
    .sheet.show{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
    .sheet.side{top:0;bottom:0;right:0;left:auto;width:440px;max-height:none;border-radius:26px 0 0 26px;transform:translateX(100%);opacity:1}
    .sheet.side.show{transform:none}
  }
  .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0;flex-shrink:0}
  @media(min-width:760px){.grab{display:none}}
  .sheet-head{display:flex;align-items:center;gap:10px;padding:12px 18px 8px;flex-shrink:0}
  .sheet-head h3{margin:0;font-size:19px;font-weight:800;flex:1}
  .sheet-close{width:36px;height:36px;border-radius:50%;background:var(--line-2);display:flex;align-items:center;justify-content:center}
  .sheet-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 18px 16px}
  .sheet-foot{flex-shrink:0;padding:12px 18px calc(14px + var(--safe-b));border-top:1px solid var(--line-2)}

  .pd-img{aspect-ratio:1.25;background:#fff;border-radius:18px;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .pd-img img{width:100%;height:100%;object-fit:contain;padding:16px}
  .pd-name{margin:14px 0 4px;font-size:21px;font-weight:800;line-height:1.2}
  .pd-desc{color:var(--ink-2);font-size:14.5px;margin:8px 0 0;white-space:pre-line}
  .pd-price{font:800 26px 'Plus Jakarta Sans',sans-serif;letter-spacing:-.02em;margin-top:6px}
  .qty-big{display:flex;align-items:center;gap:6px;background:var(--line-2);border-radius:16px;height:54px;padding:0 6px}
  .qty-big button{width:42px;height:42px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .qty-big span{min-width:28px;text-align:center;font-weight:800;font-size:17px}

  .line{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2);align-items:center}
  .line:last-child{border-bottom:0}
  .line-img{width:58px;height:58px;border-radius:14px;background:#fff;border:1px solid var(--line-2);overflow:hidden;flex-shrink:0}
  .line-img img{width:100%;height:100%;object-fit:contain;padding:4px}
  .line-img .ph{font-size:22px}
  .line-info{flex:1;min-width:0}
  .line-name{margin:0;font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .line-price{font-size:13px;color:var(--ink-2);margin-top:2px}
  .line .stepper{background:var(--line-2);color:var(--ink);height:36px}
  .line .stepper button{height:36px;width:32px}
  .sum{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2);padding:3px 0}
  .sum.total{color:var(--ink);font-weight:800;font-size:18px;padding-top:8px}
  .note{background:#FFF7E8;color:#8A4B0A;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:10px}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
  .field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:15px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
  .field textarea{min-height:76px;resize:vertical}
  .field input:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
  .field .err{color:var(--bad);font-size:12.5px;margin-top:5px;display:none}
  .field.invalid input{border-color:var(--bad)}
  .field.invalid .err{display:block}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .opt{border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:left;background:#fff;transition:.15s}
  .opt b{display:block;font-size:14px}
  .opt small{color:var(--ink-3);font-size:12.5px}
  .opt.on{border-color:var(--brand);background:var(--brand-soft)}
  .pills{display:flex;flex-wrap:wrap;gap:8px}
  .pill{height:40px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px;transition:.15s}
  .pill.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
  .alias{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--line-2);border-radius:12px;padding:10px 12px;font-size:13.5px}
  .alias b{font-family:ui-monospace,monospace;font-size:14px}

  .done{text-align:center;padding:10px 0 4px}
  .done-ic{width:84px;height:84px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;margin:6px auto 16px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  .done-ic svg.i{width:42px;height:42px;stroke-width:3}
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
  .done h3{margin:0;font-size:22px;font-weight:800}
  .done p{color:var(--ink-2);margin:6px 0 0}
  .code{display:inline-block;margin-top:12px;background:var(--line-2);border-radius:10px;padding:6px 12px;font:700 15px ui-monospace,monospace;letter-spacing:.08em}

  /* Pantalla de carga con el logo del comercio */
  #splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .45s ease,visibility .45s}
  #splash.out{opacity:0;visibility:hidden}
  .sp-stage{position:relative;width:132px;height:132px;display:flex;align-items:center;justify-content:center}
  .sp-ring{position:absolute;inset:14px;border-radius:34px;border:3px solid var(--brand);opacity:0;animation:spRing 1.8s cubic-bezier(.2,.7,.3,1) .5s infinite}
  .sp-ring.r2{animation-delay:1.4s}
  .sp-logo{width:104px;height:104px;border-radius:28px;background:var(--brand);box-shadow:0 18px 40px -16px color-mix(in srgb,var(--brand) 70%,transparent);display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;font:800 44px 'Plus Jakarta Sans',sans-serif;animation:spDrop .9s cubic-bezier(.3,1.6,.5,1) both,spFloat 2.4s ease-in-out .9s infinite}
  .sp-logo img{width:100%;height:100%;object-fit:cover}
  .sp-logo svg.i{width:46px;height:46px;stroke-width:1.8}
  .sp-logo.pop{animation:spPop .55s cubic-bezier(.3,1.6,.5,1) both,spFloat 2.4s ease-in-out .55s infinite}
  .sp-shadow{position:absolute;bottom:-4px;width:70px;height:10px;border-radius:50%;background:rgba(16,21,18,.12);animation:spShadow 2.4s ease-in-out .9s infinite}
  .sp-name{font:800 19px 'Plus Jakarta Sans',sans-serif;letter-spacing:-.02em;color:var(--ink);min-height:24px;opacity:0;animation:spFade .5s ease .45s forwards}
  .sp-dots{display:flex;gap:7px;margin-top:-10px}
  .sp-dots span{width:8px;height:8px;border-radius:50%;background:var(--brand);animation:spDot 1s ease-in-out infinite}
  .sp-dots span:nth-child(2){animation-delay:.15s}.sp-dots span:nth-child(3){animation-delay:.3s}
  @keyframes spDrop{0%{transform:translateY(-120px) scale(.6,1.2);opacity:0}55%{transform:translateY(0) scale(1.18,.82);opacity:1}75%{transform:translateY(-10px) scale(.95,1.06)}100%{transform:none}}
  @keyframes spPop{0%{transform:scale(.5) rotate(-12deg)}60%{transform:scale(1.12) rotate(4deg)}100%{transform:none}}
  @keyframes spFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes spShadow{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.78);opacity:.6}}
  @keyframes spRing{0%{transform:scale(.85);opacity:.55}100%{transform:scale(1.45);opacity:0}}
  @keyframes spDot{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-7px);opacity:1}}
  @keyframes spFade{to{opacity:1}}

  /* Gastronomía: formato carta */
  .food .grid{grid-template-columns:1fr;gap:10px}
  @media(min-width:760px){.food .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}}
  .food .card{flex-direction:row-reverse;min-height:124px}
  .food .card-img{width:124px;aspect-ratio:auto;border-bottom:0;border-left:1px solid var(--line-2);flex-shrink:0}
  .food .card-img img{object-fit:cover;padding:0}
  .food .card-img .ph{font-size:34px}
  .food .card-body{padding:12px 14px}
  .food .tag-out{left:auto;right:10px}

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCFiHwebmIbwqVjaW0nu6_Swb646zFyX8k",
  authDomain: /(^|\.)ventra\.store$/.test(location.hostname) ? location.hostname : "ventra-9cba5.firebaseapp.com",
  projectId: "ventra-9cba5",
  storageBucket: "ventra-9cba5.firebasestorage.app",
  messagingSenderId: "23136382753",
  appId: "1:23136382753:web:5d2f4115a77a607435d860"
});
var db = firebase.firestore();

/* ───────── utilidades ───────── */
var DAYS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var DAYS_CAP = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function money(n){ return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n||0); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function ic(name,cls){ return '<svg class="i '+(cls||'')+'" aria-hidden="true"><use href="#i-'+name+'"/></svg>'; }
function $(sel,root){ return (root||document).querySelector(sel); }
function initial(name){ var ch=(String(name||'').trim()[0]||'').toUpperCase(); return /[A-Z0-9ÁÉÍÓÚÑÜ]/.test(ch)?ch:'•'; }
function imgOrPh(url,name){
  return url ? '<img src="'+esc(url)+'" alt="" loading="lazy" decoding="async" onerror="this.outerHTML=\'<div class=ph>'+initial(name)+'</div>\'">'
             : '<div class="ph">'+initial(name)+'</div>';
}
function unitLabel(u){ return u==='KG'?'/kg':u==='L'?'/l':u==='MT'?'/m':''; }
function toast(msg){ var t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show');},1800); }
function normalize(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

var S = {
  storeId:null, cfg:null, products:[], byId:{}, cats:[],
  cart:{}, q:'', cat:'ALL',
  step:'cart', delivery:null, payment:null, lastOrder:null, notes:{}, lines:{}, food:false, subs:{}, sub:'ALL'
};

/* ───────── horarios ───────── */
function toMin(hhmm){ var p=String(hhmm||'0:0').split(':'); return (+p[0])*60+(+p[1]||0); }
/* Cada día puede tener varios turnos (ej. 9 a 13 y 17 a 21). Las tiendas viejas solo tienen from/to. */
function dayRanges(h){
  if(!h||!h.open) return [];
  var r=(h.ranges&&h.ranges.length)?h.ranges:[{from:h.from,to:h.to}];
  return mergeRanges(r.filter(function(x){return x&&x.from&&x.to;}));
}
/* Junta los turnos repetidos o que se pisan (9 a 20 y 17 a 21 = 9 a 21). Los que pasan la medianoche quedan aparte. */
function mergeRanges(list){
  var day=[], night=[];
  list.forEach(function(x){ (toMin(x.to)>toMin(x.from)?day:night).push({from:x.from,to:x.to}); });
  day.sort(function(a,b){return toMin(a.from)-toMin(b.from);});
  var out=[];
  day.forEach(function(x){
    var last=out[out.length-1];
    if(last && toMin(x.from)<=toMin(last.to)){ if(toMin(x.to)>toMin(last.to)) last.to=x.to; }
    else out.push(x);
  });
  night.forEach(function(x){ if(!out.some(function(o){return o.from===x.from&&o.to===x.to;})) out.push(x); });
  return out;
}
function openStatus(hours){
  if(!hours || !hours.length) return null;
  var now=new Date(), d=now.getDay(), m=now.getHours()*60+now.getMinutes(), today=dayRanges(hours[d]);
  for(var i=0;i<today.length;i++){
    if(m>=toMin(today[i].from) && m<toMin(today[i].to)) return {open:true,text:'Abierto · cierra '+today[i].to};
  }
  for(var j=0;j<today.length;j++){
    if(m<toMin(today[j].from)) return {open:false,text:(j>0?'Cerrado · vuelve a abrir ':'Cerrado · abre hoy ')+today[j].from};
  }
  for(var k=1;k<8;k++){
    var dd=(d+k)%7, r=dayRanges(hours[dd]);
    if(!r.length) continue;
    return {open:false,text:k===1?'Cerrado · abre mañana '+r[0].from:'Cerrado · abre el '+DAYS[dd]+' '+r[0].from};
  }
  return {open:false,text:'Cerrado'};
}

/* ───────── carrito ───────── */
function cartKey(){ return 'ventra_cart_v2_'+S.storeId; }
/* Cada línea del pedido es un producto con sus extras: la clave es "id" o "id~extra1.extra2"
   (la misma pizza con y sin borde relleno son dos líneas). S.lines guarda los extras de cada clave. */
function pidOf(key){ return String(key).split('~')[0]; }
function extrasOf(key){ return (S.lines[key]&&S.lines[key].extras)||[]; }
function unitOf(key){ var p=S.byId[pidOf(key)]; return (p?p.price:0)+extrasOf(key).reduce(function(a,x){ return a+(Number(x.price)||0); },0); }
function lineName(key){ var p=S.byId[pidOf(key)], ex=extrasOf(key); return (p?p.name:'')+(ex.length?' + '+ex.map(function(x){ return x.name; }).join(' + '):''); }
function qtyOf(pid){ return Object.keys(S.cart).reduce(function(a,k){ return a+(pidOf(k)===pid?S.cart[k]:0); },0); }
function loadCart(){
  try{
    var raw=JSON.parse(localStorage.getItem(cartKey())||'{}'), lines=JSON.parse(localStorage.getItem(cartKey()+'_lines')||'{}'), out={};
    Object.keys(raw).forEach(function(k){
      var p=S.byId[pidOf(k)];
      if(!p || p.inStock===false || !(raw[k]>0)) return;
      if(k.indexOf('~')>=0){ if(!lines[k]) return; S.lines[k]=lines[k]; }
      out[k]=raw[k];
    });
    return out;
  }catch(e){ return {}; }
}
function saveCart(){ try{ localStorage.setItem(cartKey(),JSON.stringify(S.cart)); localStorage.setItem(cartKey()+'_notes',JSON.stringify(S.notes)); localStorage.setItem(cartKey()+'_lines',JSON.stringify(S.lines)); }catch(e){} }
function cartItems(){ return Object.keys(S.cart).map(function(k){ var p=S.byId[pidOf(k)]; return p?{key:k,p:p,qty:S.cart[k],unit:unitOf(k),name:lineName(k),extras:extrasOf(k)}:null; }).filter(Boolean); }
function cartCount(){ return cartItems().reduce(function(a,x){return a+x.qty;},0); }
function subtotal(){ return cartItems().reduce(function(a,x){return a+x.qty*x.unit;},0); }
/* Promos por cantidad (ej. 12 empanadas de cualquier gusto a precio fijo). Se toman primero las
   unidades más caras. Devuelve [{name, times, discount, missing}] */
function promoLines(){
  // Primero las de más unidades: con 18 empanadas se arma una docena y después una media docena
  var promos=(S.cfg.onlinePromos||[]).slice().sort(function(a,b){ return b.qty-a.qty; }), left={}, out=[];
  Object.keys(S.cart).forEach(function(k){ left[k]=S.cart[k]; });
  promos.forEach(function(pr){
    var units=[];
    // Las promos cuentan unidades del producto (los extras se cobran aparte)
    Object.keys(left).forEach(function(k){ var p=S.byId[pidOf(k)]; if(p && pr.productIds.indexOf(pidOf(k))>=0) for(var i=0;i<left[k];i++) units.push({id:k,price:p.price}); });
    var n=units.length, times=Math.floor(n/pr.qty);
    if(!times){ if(n>0) out.push({name:pr.name,times:0,discount:0,missing:pr.qty-n,price:pr.price,qty:pr.qty}); return; }
    units.sort(function(a,b){ return b.price-a.price; });
    var used=units.slice(0,times*pr.qty), regular=used.reduce(function(a,u){ return a+u.price; },0);
    var discount=regular-times*pr.price;
    if(discount<=0) return;
    used.forEach(function(u){ left[u.id]--; });
    var rest=n-times*pr.qty;
    out.push({name:pr.name,times:times,discount:discount,missing:rest>0?pr.qty-rest:0,price:pr.price,qty:pr.qty});
  });
  return out;
}
function promoDiscount(){ return promoLines().reduce(function(a,x){ return a+x.discount; },0); }
function itemsTotal(){ return subtotal()-promoDiscount(); }
function promoHtml(){
  var lines=promoLines(), hint=null;
  // Un solo aviso: la promo a la que le falta menos (ej. "sumá 2 más y es una docena")
  lines.forEach(function(x){ if(x.missing>0 && x.missing<x.qty && (!hint || x.missing<hint.missing)) hint=x; });
  return lines.map(function(x){
    return x.discount?'<div class="sum promo"><span>'+esc(x.name)+(x.times>1?' x'+x.times:'')+'</span><span>-'+money(x.discount)+'</span></div>':'';
  }).join('')+(hint?'<div class="promo-hint">Sumá '+hint.missing+' más y aprovechás la promo “'+esc(hint.name)+'” ('+hint.qty+' a '+money(hint.price)+')</div>':'');
}
function deliveryCost(){
  var c=S.cfg; if(S.delivery!=='DELIVERY') return 0;
  var sub=subtotal();
  if(c.freeDeliveryFrom>0 && sub>=c.freeDeliveryFrom) return 0;
  return c.deliveryCost||0;
}
function setQty(id,qty){

/* ───────── arranque ───────── */
async function init(){
  var slug=decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g,''));
  if(!slug){ hideSplash(); return notFound('Tiendas online de Ventra','Para ver una tienda, entrá con el enlace que te compartió el comercio.'); }
  try{
    var snap=await db.collection('ventra_stores').where('claimed','==',true).where('subdomain','==',slug).limit(1).get();
    if(snap.empty){ hideSplash(); return notFound('No encontramos esta tienda','Revisá que el enlace esté bien escrito.'); }
    var doc=snap.docs[0], cfg=doc.data();
    if(!cfg.isPublished){ hideSplash(); return notFound('Tienda en preparación','El comercio todavía no la publicó. Volvé a entrar en un rato.'); }
    S.storeId=doc.id; S.cfg=cfg;
    S.food = cfg.rubro==='GASTRONOMIA';
    splashBrand(cfg,slug);
    cfg.pickupEnabled = cfg.pickupEnabled!==false;
    cfg.paymentMethods = (cfg.paymentMethods&&cfg.paymentMethods.length)?cfg.paymentMethods:['Efectivo','Transferencia'];
    applyBrand(cfg);

    var ps=await db.collection('ventra_stores').doc(doc.id).collection('products').get();
    var list=ps.docs.map(function(d){ var x=d.data(); x.id=d.id; return x; });
    // Opción de la tienda: vender todo aunque en el sistema figure sin stock. En gastronomía se cocina a pedido: el stock no cuenta
    if(cfg.alwaysInStock || S.food) list.forEach(function(p){ p.inStock=true; });
    // Pausados a mano ("hoy no hay"): se ven, pero no se pueden pedir
    var paused=cfg.pausedIds||[];
    list.forEach(function(p){ if(paused.indexOf(p.id)>=0){ p.inStock=false; p.paused=true; } });
    list=groupVariants(list);
    list.forEach(function(p){ p._q=normalize(p.name+' '+(p.brand||'')+' '+(p.category||'')+' '+(p.description||'')); });
    if(cfg.showOutOfStock===false) list=list.filter(function(p){return p.inStock!==false || p.paused;});
    list.sort(function(a,b){ return (b.inStock!==false)-(a.inStock!==false) || String(a.name).localeCompare(String(b.name),'es'); });
    S.products=list;
    list.forEach(function(p){ S.byId[p.id]=p; });
    // Categoría principal (Bebidas) y subcategoría (Cerveza). Sin categoría principal, la categoría es la principal.
    var cs={}; S.subs={};
    list.forEach(function(p){
      p.top=p.parentCategory||p.category||'Otros';
      cs[p.top]=(cs[p.top]||0)+1;
      if(p.parentCategory && p.category && p.category!==p.parentCategory){ (S.subs[p.top]=S.subs[p.top]||{})[p.category]=1; }
    });
    Object.keys(S.subs).forEach(function(t){ S.subs[t]=Object.keys(S.subs[t]).sort(function(a,b){ return a.localeCompare(b,'es'); }); });
    // En la carta, bebidas y postres van al final (como en cualquier menú)
    var rank=function(c){ return c==='Varios'||c==='Otros'?3:S.food&&/postre|dulce|helad/i.test(c)?2:S.food&&/bebida|gaseosa|cerveza|vino|trago|agua|jugo/i.test(c)?1:0; };
    S.cats=Object.keys(cs).sort(function(a,b){ return rank(a)-rank(b) || a.localeCompare(b,'es'); });
    S.cart=loadCart();
    try{ var nt=JSON.parse(localStorage.getItem(cartKey()+'_notes')||'{}'); Object.keys(nt).forEach(function(id){ if(S.cart[id]) S.notes[id]=nt[id]; }); }catch(e){}
    S.delivery = cfg.pickupEnabled ? 'PICKUP' : (cfg.deliveryEnabled ? 'DELIVERY' : (cfg.goDeliveryEnabled ? 'GODELIVERY' : null));
    render();
    hideSplash();
  }catch(err){
    console.error(err);
    hideSplash();
    notFound('No pudimos cargar la tienda','Revisá tu conexión e intentá de nuevo en unos minutos.');
  }
}

/* ───────── productos con opciones ─────────
   Las variantes (tamaño, talle) de un mismo producto se muestran juntas en una sola tarjeta. */
function nice(t){
  t=String(t||'').trim();
  // En gastronomía los nombres del sistema (en mayúsculas) se ven como en una carta
  if(!S.food || t!==t.toUpperCase() || !/[A-ZÁÉÍÓÚÑ]/.test(t)) return t;
  var l=t.toLowerCase(); return l.charAt(0).toUpperCase()+l.slice(1);
}
function groupVariants(list){
  var groups={}, out=[];
  list.forEach(function(p){
    if(!p.variantGroupId){ p.name=nice(p.name); out.push(p); return; }
    var g=groups[p.variantGroupId];
    if(!g){ g=groups[p.variantGroupId]={id:'g_'+p.variantGroupId,isGroup:true,variants:[],name:nice(p.baseName||p.name),category:p.category,parentCategory:p.parentCategory,brand:p.brand,unit:p.unit,description:''}; out.push(g); }
    p.optLabel=nice(p.variantLabel||p.name);
    p.name=g.name+' ('+p.optLabel+')';
    p.groupId=g.id;
    g.variants.push(p);
    S.byId[p.id]=p;
  });
  out.forEach(function(g){
    if(!g.isGroup) return;
    g.variants.sort(function(a,b){ return a.price-b.price || String(a.optLabel).localeCompare(String(b.optLabel),'es'); });
    var avail=g.variants.filter(function(v){ return v.inStock!==false; });
    g.price=(avail[0]||g.variants[0]).price;
    g.fromPrice=g.variants.some(function(v){ return v.price!==g.price; });
    g.inStock=avail.length>0;
    g.paused=!avail.length && g.variants.every(function(v){ return v.paused; });
    var withImg=g.variants.filter(function(v){ return v.imageUrl; })[0];
    g.imageUrl=withImg?withImg.imageUrl:'';
    g.description=(g.variants.filter(function(v){ return v.description; })[0]||{}).description||'';
    if(g.variants.length===1){ var only=g.variants[0]; only.name=g.name; }
  });
  return out;
}
/* Tarjeta donde se ve un producto (la del grupo si es una opción) */
function cardIdOf(id){ var p=S.byId[id]; return p&&p.groupId?p.groupId:id; }
function groupQty(g){ return g.variants.reduce(function(a,v){ return a+qtyOf(v.id); },0); }
/* Extras (borde relleno, agregados): grupos configurados por categoría o por producto */
function extrasFor(p,sel){
  return (S.cfg.extraGroups||[]).filter(function(g){
    if(g.active===false || !(g.options||[]).length) return false;
    // Excluidos a mano (ej. las pizzas rellenas no llevan borde relleno)
    var ex=g.excludeIds||[];
    if(ex.length){
      if(sel && ex.indexOf(sel.id)>=0) return false;
      if(ex.indexOf(p.id)>=0) return false;
      if(p.isGroup && p.variants.every(function(v){ return ex.indexOf(v.id)>=0; })) return false;
    }
    var cats=g.categories||[];
    if(cats.indexOf(p.category)>=0 || (p.parentCategory && cats.indexOf(p.parentCategory)>=0)) return true;
    var ids=g.productIds||[];
    return ids.indexOf(p.id)>=0 || (sel&&ids.indexOf(sel.id)>=0) || (p.isGroup&&p.variants.some(function(v){ return ids.indexOf(v.id)>=0; }));
  });
}
function hasExtras(p){ return extrasFor(p,null).length>0; }
/* Nombre de categoría para mostrar: en la carta, "AGUA SABORIZADA" se ve "Agua saborizada" */
function catName(c){ return nice(c); }
function kitchenClosed(){ if(!S.food) return null; var st=openStatus(S.cfg.hours); return st&&!st.open?st:null; }

/* Si el color de la marca es muy claro (rosa pastel, amarillo) el texto blanco de los botones no se lee:
   se oscurece lo justo hasta que contraste. El color elegido se sigue reconociendo. */
function legibleBrand(hex){
  if(!/^#[0-9a-f]{6}$/i.test(hex||'')) return '#0E6E52';
  var rgb=[1,3,5].map(function(i){ return parseInt(hex.substr(i,2),16); });
  var lum=function(c){ var a=c.map(function(v){ v/=255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4); }); return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2]; };
  for(var i=0;i<20 && (1.05)/(lum(rgb)+0.05)<3.2;i++) rgb=rgb.map(function(v){ return Math.round(v*0.9); });
  return '#'+rgb.map(function(v){ return ('0'+v.toString(16)).slice(-2); }).join('');
}
function applyBrand(cfg){

  document.documentElement.style.setProperty('--brand',brand);
  $('#metaTheme').setAttribute('content',brand);
  var title=cfg.businessName+' · Pedí online';
  document.title=title; $('#ogTitle').setAttribute('content',title);
  var desc=cfg.description||('Mirá el catálogo de '+cfg.businessName+' y hacé tu pedido por WhatsApp.');
  $('#metaDesc').setAttribute('content',desc); $('#ogDesc').setAttribute('content',desc);
  if(cfg.bannerUrl||cfg.logoUrl) $('#ogImage').setAttribute('content',cfg.bannerUrl||cfg.logoUrl);
  if(cfg.logoUrl) $('#favicon').setAttribute('href',cfg.logoUrl);
}

function productCard(p){

function priceHtml(p){ return '<span class="price">'+(p.isGroup&&p.fromPrice?'<small class="from">desde</small>':'')+money(p.price)+'<small>'+unitLabel(p.unit)+'</small></span>'; }
function buyControl(id,qty,out){

      }).join('')+'</div>';
    }
    cats.forEach(function(ct){
      var items=S.products.filter(function(p){ return p.top===ct && (S.cat==='ALL' || S.sub==='ALL' || p.category===S.sub); });
      if(!items.length) return;
      var subs=S.subs[ct]||[], body='';
      if(subs.length>1){
        // Agrupado por subcategoría, con un título chico para cada una
        var rest=items.filter(function(p){ return subs.indexOf(p.category)<0; });
        subs.forEach(function(sc){

var DAYS_SHORT=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
/* Horarios agrupados: los días seguidos con el mismo horario van en una sola línea (Lun a Vie). */
function hoursHtml(c,st){
  if(!c.hours || !c.hours.length) return '';
  var today=new Date().getDay(), groups=[];
  [1,2,3,4,5,6,0].forEach(function(i){
    var r=dayRanges(c.hours[i]), key=r.map(function(x){return x.from+'-'+x.to;}).join('|');
    var g=groups[groups.length-1];
    if(g && g.key===key) g.days.push(i); else groups.push({key:key,ranges:r,days:[i]});
  });
  var rows=groups.map(function(g){
    var n=g.days.length, first=g.days[0], last=g.days[n-1];
    var label=n===7?'Todos los días':n===1?DAYS_CAP[first]:n===2?DAYS_SHORT[first]+' y '+DAYS_SHORT[last]:DAYS_SHORT[first]+' a '+DAYS_SHORT[last];
    var isToday=g.days.indexOf(today)>=0;
    return '<div class="hours-row'+(isToday?' today':'')+'"><span class="h-day">'+label+(isToday?'<small>Hoy</small>':'')+'</span>'
      +'<span class="h-times">'+(g.ranges.length?g.ranges.map(function(x){return '<span>'+esc(x.from)+' – '+esc(x.to)+'</span>';}).join(''):'<span class="h-closed">Cerrado</span>')+'</span></div>';
  }).join('');
  return '<div class="hours"><div class="hours-head"><h4>'+ic('clock')+'Horarios</h4>'
    +(st?'<span class="chip '+(st.open?'open':'closed')+'"><span class="dot"></span>'+(st.open?'Abierto ahora':'Cerrado ahora')+'</span>':'')
    +'</div>'+rows+'</div>';
}

function orderCode(){ var a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s=''; for(var i=0;i<4;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; }

async function sendOrder(btn){
  var c=S.cfg, name=$('#cName').value.trim(), phone=$('#cPhone').value.trim(), addrEl=$('#cAddr'), addr=addrEl?addrEl.value.trim():'', note=$('#cNote').value.trim();
  var ok=true;
  $('#f-name').classList.toggle('invalid',!name); if(!name) ok=false;
  $('#f-phone').classList.toggle('invalid',phone.replace(/\D/g,'').length<6); if(phone.replace(/\D/g,'').length<6) ok=false;
  if(addrEl){ $('#f-addr').classList.toggle('invalid',!addr); if(!addr) ok=false; }
  if(!ok){ toast('Revisá los datos marcados'); return; }
  try{ localStorage.setItem('ventra_customer',JSON.stringify({name:name,phone:phone,address:addr||undefined})); }catch(e){}

  var items=cartItems().map(function(x){
    var it={productId:x.p.id,name:x.name,price:x.unit,qty:x.qty};
    if(x.extras.length) it.extras=x.extras.map(function(e){ return {name:e.name,price:Number(e.price)||0}; });
    if(S.notes[x.key]) it.note=S.notes[x.key];
    return it;
  });
  var promos=promoLines().filter(function(x){ return x.discount>0; }), disc=promoDiscount();
  var sub=subtotal(), dc=deliveryCost(), total=sub-disc+dc, code=orderCode(), channel=c.orderChannel||'BOTH';
  btn.disabled=true; btn.innerHTML='<span class="spin" style="width:22px;height:22px;border-width:3px;border-color:rgba(255,255,255,.35);border-top-color:#fff"></span>';

  var base={items:items,total:total,customerName:name,customerPhone:phone,customerNote:note,status:'PENDING',syncedLocal:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()};
  var rich=Object.assign({},base,{orderCode:code,delivery:S.delivery||'PICKUP',address:addr,paymentMethod:S.payment||'',deliveryCost:dc},disc?{discount:disc}:{});
  var orders=db.collection('ventra_stores').doc(S.storeId).collection('orders'), saved=false;
  // "Solo WhatsApp": el pedido no se guarda en la app, llega únicamente por WhatsApp
  if(channel!=='WHATSAPP'){
    try{ await orders.add(rich); saved=true; }
    catch(e){
      // Reglas viejas: se guarda con el formato anterior y los detalles en la nota
      var extra=['#'+code, S.delivery==='DELIVERY'?'Envío a: '+addr:S.delivery==='GODELIVERY'?'Envío con GoDelivery a: '+addr:'Retira en el local', 'Paga con: '+(S.payment||'-'), note].filter(Boolean).join(' — ');
      try{ await orders.add(Object.assign({},base,{customerNote:extra.slice(0,1000)})); saved=true; }catch(e2){ console.warn('El pedido se envía solo por WhatsApp',e2); }
    }
  }

  var L=[];
  // Sin emojis: el enlace de WhatsApp los rompe en algunas PCs y celulares (salen como "?")
  L.push('Hola! Quiero hacer este pedido en *'+c.businessName+'*');
  L.push('');
  L.push('*PEDIDO #'+code+'*');
  items.forEach(function(i){ L.push('- '+i.qty+' x '+i.name+': '+money(i.price*i.qty)+(i.note?' ('+i.note+')':'')); });
  L.push('');
  promos.forEach(function(x){ L.push('Promo '+x.name+(x.times>1?' x'+x.times:'')+': -'+money(x.discount)); });
  if(S.delivery==='DELIVERY'){ L.push('Subtotal: '+money(sub-disc)); L.push('Envio: '+(dc?money(dc):'gratis')); }
  L.push('*TOTAL: '+money(total)+'*');
  L.push('');
  L.push('*Cliente:* '+name);
  L.push('*Telefono:* '+phone);
  L.push(S.delivery==='DELIVERY'?'*Entrega:* envio a '+addr:S.delivery==='GODELIVERY'?'*Entrega:* envio con GoDelivery a '+addr+' (el envio lo cobra GoDelivery)':'*Entrega:* retiro en el local');
  if(S.payment) L.push('*Pago:* '+S.payment);
  if(note) L.push('*Nota:* '+note);
  var url='https://wa.me/'+String(c.whatsappNumber||'').replace(/\D/g,'')+'?text='+encodeURIComponent(L.join('\n'));

  // "Solo la app": si se guardó, llega al celular del comercio sin pasar por WhatsApp
  var viaApp=channel==='APP' && saved;
  if(channel==='APP' && !saved) toast('No pudimos enviarlo online: mandalo por WhatsApp');
  S.lastOrder={code:code,url:c.whatsappNumber?url:'',viaApp:viaApp,phone:phone};
  S.cart={}; S.notes={}; S.lines={}; saveCart(); refreshCartBar();
  S.products.forEach(function(p){ refreshProduct(p.id); });
  S.step='done'; renderCartSheet();
  if(!viaApp) window.location.href=url;
}

function pad2(n){ return String(n).padStart(2,'0'); }
function hhmm(m){ return pad2(Math.floor(m/60))+':'+pad2(m%60); }
function localNow(ms){ var d=new Date((ms||Date.now())+TZ_OFFSET_MIN*60000); return {dateKey:d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate()),min:d.getUTCHours()*60+d.getUTCMinutes()}; }
function addDays(k,n){ var d=new Date(k+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function wday(k){ return new Date(k+'T12:00:00Z').getUTCDay(); }
function durLabel(m){ return m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+(m%60)+' min':''); }
function canDo(st,sv){ return !sv.staffIds||!sv.staffIds.length||sv.staffIds.indexOf(st.id)>=0; }
function staffRanges(h){ return dayRanges(h).map(function(r){ return {s:toMin(r.from),e:toMin(r.to)}; }).filter(function(r){ return r.e>r.s; }); }
function minStartFor(k){
  var a=AG(), now=localNow(), maxDays=Math.max(1,Math.min(180,Number(a.maxDaysAhead)||30));
  if(k<now.dateKey || k>addDays(now.dateKey,maxDays-1)) return Infinity;
  var e=localNow(Date.now()+Math.max(0,Number(a.minNoticeMin)||0)*60000);
  if(k<e.dateKey) return Infinity;
  return k===e.dateKey?e.min:0;
}
function freeStarts(st,sv,k,busy,minStart){
  var a=AG(), step=Math.max(5,Number(a.slotStepMin)||15), buf=Math.max(0,Number(a.bufferMin)||0), dur=Math.max(5,Number(sv.durationMin)||30), out=[];
  staffRanges((st.hours||[])[wday(k)]).forEach(function(r){
    for(var t=r.s;t+dur<=r.e;t+=step){
      if(t<minStart) continue;
      var clash=busy.some(function(b){ return (b.staffId===st.id||b.staffId==='ALL') && t<b.e+buf && b.s<t+dur+buf; });
      if(!clash) out.push(t);
    }
  });
  return out;
}
var DAYS_LONG=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function capFirst(t){ return t.charAt(0).toUpperCase()+t.slice(1); }
function dayText(k){ var t=localNow().dateKey, d=+k.slice(8), m=+k.slice(5,7); return (k===t?'hoy':k===addDays(t,1)?'mañana':DAYS_LONG[wday(k)])+' '+d+' de '+MONTHS[m-1]; }

function servicesHtml(){
  return '<section class="section" id="turnos"><h2 class="display">Reservá tu turno</h2><div class="svc-list">'
    +agServices().map(function(v){
      return '<button class="svc" data-act="book-svc" data-id="'+esc(v.id)+'"><div class="svc-info"><div class="svc-name">'+esc(v.name)+'</div>'
        +'<div class="svc-meta">'+ic('clock')+durLabel(Number(v.durationMin)||30)+(v.price>0?' · <b style="color:var(--ink)">'+money(v.price)+'</b>':'')+'</div>'
        +(v.description?'<div class="svc-desc">'+esc(v.description)+'</div>':'')+'</div><span class="go">Reservar</span></button>';
    }).join('')+'</div></section>';
}

S.bk={step:'service'}; S.bkBusy={};
function bkService(){ return agServices().filter(function(x){ return x.id===S.bk.serviceId; })[0]; }
function bkStaffFor(sv){ return agStaff().filter(function(st){ return canDo(st,sv); }); }
function openBooking(serviceId){
  S.bk={step:serviceId?'staff':'service',serviceId:serviceId||null,staffId:null,day:null,time:null};
  if(serviceId && bkStaffFor(bkService()).length===1){ S.bk.staffId=bkStaffFor(bkService())[0].id; S.bk.step='time'; }
  renderBooking(); openSheet('bookSheet');
}
function loadBusy(k){
  if(S.bkBusy[k]) return Promise.resolve(S.bkBusy[k]);
  return db.collection('ventra_stores').doc(S.storeId).collection('agenda_busy').doc(k).get()
    .then(function(d){ S.bkBusy[k]=(d.exists&&d.data().items)||[]; return S.bkBusy[k]; })
    .catch(function(){ return []; });
}
/* Horarios libres del día: con "cualquiera", la unión de los profesionales que hacen el servicio */
function slotsFor(k){
  var sv=bkService(), busy=S.bkBusy[k]||[], min=minStartFor(k), set={};
  if(min===Infinity) return [];
  bkStaffFor(sv).filter(function(st){ return !S.bk.staffId||S.bk.staffId==='ANY'||st.id===S.bk.staffId; }).forEach(function(st){
    freeStarts(st,sv,k,busy,min).forEach(function(t){ set[t]=1; });
  });
  return Object.keys(set).map(Number).sort(function(a,b){return a-b;});
}
/* Días con algún horario de atención (sin mirar lo ocupado todavía) */
function workDays(){
  var sv=bkService(), out=[], now=localNow().dateKey, n=Math.max(1,Math.min(60,Number(AG().maxDaysAhead)||30));
  var staff=bkStaffFor(sv).filter(function(st){ return !S.bk.staffId||S.bk.staffId==='ANY'||st.id===S.bk.staffId; });
  for(var i=0;i<n;i++){
    var k=addDays(now,i);
    if(minStartFor(k)===Infinity) continue;
    if(staff.some(function(st){ return staffRanges((st.hours||[])[wday(k)]).length>0; })) out.push(k);
  }
  return out;
}

function bkHead(title,back){
  var steps=['service','staff','time','data'], idx=steps.indexOf(S.bk.step);
  return '<div class="grab"></div><div class="sheet-head">'+(back?'<button class="sheet-close" data-act="bk-back" aria-label="Volver">'+ic('back')+'</button>':'')
    +'<h3 class="display">'+title+'</h3><button class="sheet-close" data-act="close" aria-label="Cerrar">'+ic('x')+'</button></div>'
    +(idx>=0?'<div class="bk-steps">'+steps.map(function(x,i){ return '<span class="'+(i<=idx?'on':'')+'"></span>'; }).join('')+'</div>':'');
}
function renderBooking(){
  var el=$('#bookSheet'), b=S.bk, sv=bkService();
  if(b.step==='service'){
    el.innerHTML=bkHead('¿Qué te querés hacer?',false)+'<div class="sheet-body"><div class="svc-list" style="grid-template-columns:1fr">'
      +agServices().map(function(v){ return '<button class="svc" data-act="bk-pick-svc" data-id="'+esc(v.id)+'"><div class="svc-info"><div class="svc-name">'+esc(v.name)+'</div><div class="svc-meta">'+ic('clock')+durLabel(Number(v.durationMin)||30)+(v.price>0?' · <b style="color:var(--ink)">'+money(v.price)+'</b>':'')+'</div>'+(v.description?'<div class="svc-desc">'+esc(v.description)+'</div>':'')+'</div></button>'; }).join('')
      +'</div></div>';
    return;
  }
  if(b.step==='staff'){
    var list=bkStaffFor(sv);
    el.innerHTML=bkHead('¿Con quién?',true)+'<div class="sheet-body"><p style="margin:0 0 12px;color:var(--ink-2);font-size:14px">'+esc(sv.name)+' · '+durLabel(Number(sv.durationMin)||30)+'</p><div class="who-list">'
      +(list.length>1?'<button class="who" data-act="bk-pick-staff" data-id="ANY"><span class="who-av" style="background:var(--ink-3)">'+ic('clock')+'</span><span><b>Cualquiera</b><br><small style="color:var(--ink-3)">El primer horario libre</small></span></button>':'')
      +list.map(function(st){ return '<button class="who" data-act="bk-pick-staff" data-id="'+esc(st.id)+'"><span class="who-av" style="background:'+esc(st.color||'var(--brand)')+'">'+initial(st.name)+'</span><b>'+esc(st.name)+'</b></button>'; }).join('')
      +'</div></div>';
    return;
  }
  if(b.step==='time'){
    var days=workDays();
    if(!b.day || days.indexOf(b.day)<0) b.day=days[0]||null;
    var body='';
    if(!days.length){ body='<div class="empty"><b>No hay turnos disponibles</b>Escribinos por WhatsApp y lo coordinamos.</div>'; }
    else {
      body='<div class="days">'+days.map(function(k){ return '<button class="day'+(k===b.day?' on':'')+'" data-act="bk-day" data-v="'+k+'"><small>'+(k===localNow().dateKey?'Hoy':DAYS_LONG[wday(k)].slice(0,3))+'</small><b>'+(+k.slice(8))+'</b><small>'+MONTHS[+k.slice(5,7)-1].slice(0,3)+'</small></button>'; }).join('')+'</div>';
      if(!S.bkBusy[b.day]){ body+='<div style="display:flex;justify-content:center;padding:30px"><div class="spin"></div></div>'; loadBusy(b.day).then(function(){ if(S.bk.step==='time') renderBooking(); }); }
      else {
        var slots=slotsFor(b.day);
        if(!slots.length) body+='<div class="empty" style="padding:30px 10px"><b>No quedan horarios este día</b>Probá con otro día.</div>';
        else {
          var parts=[['Mañana',0,720],['Tarde',720,1200],['Noche',1200,1440]];
          parts.forEach(function(pt){
            var g=slots.filter(function(t){ return t>=pt[1]&&t<pt[2]; });
            if(!g.length) return;
            body+='<div class="slot-group">'+pt[0]+'</div><div class="slots">'+g.map(function(t){ return '<button class="slot'+(b.time===t?' on':'')+'" data-act="bk-time" data-v="'+t+'">'+hhmm(t)+'</button>'; }).join('')+'</div>';
          });
        }
      }
    }
    var st=agStaff().filter(function(x){ return x.id===b.staffId; })[0];
    el.innerHTML=bkHead('Elegí día y horario',true)+'<div class="sheet-body"><p style="margin:0 0 12px;color:var(--ink-2);font-size:14px">'+esc(sv.name)+(st?' · con '+esc(st.name):'')+'</p>'+body+'</div>';
    return;
  }
  if(b.step==='data'){
    var saved={}; try{ saved=JSON.parse(localStorage.getItem('ventra_customer')||'{}'); }catch(e){}
    var st2=agStaff().filter(function(x){ return x.id===b.staffId; })[0];
    el.innerHTML=bkHead('Tus datos',true)+'<div class="sheet-body">'
      +'<div class="bk-sum"><div>'+ic('check')+'<b>'+esc(sv.name)+'</b>'+(sv.price>0?'<span style="margin-left:auto">'+money(sv.price)+'</span>':'')+'</div>'
      +'<div>'+ic('clock')+esc(capFirst(dayText(b.day)))+', '+hhmm(b.time)+' hs</div>'
      +(st2?'<div>'+ic('store')+'Con '+esc(st2.name)+'</div>':'')+'</div>'
      +'<div class="field" id="b-name"><label for="bName">Nombre y apellido</label><input id="bName" autocomplete="name" value="'+esc(saved.name||'')+'" placeholder="Juana Pérez"><div class="err">Escribí tu nombre.</div></div>'
      +'<div class="field" id="b-phone"><label for="bPhone">WhatsApp</label><input id="bPhone" type="tel" inputmode="tel" autocomplete="tel" value="'+esc(saved.phone||'')+'" placeholder="11 2345 6789"><div class="err">Escribí tu WhatsApp con código de área.</div></div>'
      +'<div class="field"><label for="bNote">Algo que quieras aclarar (opcional)</label><textarea id="bNote" placeholder="Ej: es para mi hija de 8 años"></textarea></div>'
      +'</div><div class="sheet-foot"><button class="btn btn-brand btn-block" data-act="bk-confirm">Confirmar turno</button></div>';
    return;
  }
  if(b.step==='done'){
    var r=b.result, pending=r.status==='PENDING';
    var start=r.date.replace(/-/g,'')+'T'+r.time.replace(':','')+'00';
    var endMin=toMin(r.time)+(Number(sv.durationMin)||30);
    var gcal='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(r.serviceName+' · '+S.cfg.businessName)
      +'&dates='+start+'/'+r.date.replace(/-/g,'')+'T'+hhmm(endMin).replace(':','')+'00&ctz=America/Argentina/Buenos_Aires'
      +(S.cfg.address?'&location='+encodeURIComponent(S.cfg.address):'')+'&details='+encodeURIComponent('Turno #'+r.code+(r.staffName?' con '+r.staffName:''));
    var L=['Hola! Reservé un turno en *'+S.cfg.businessName+'*','','*'+r.serviceName+'*'+(r.staffName?' con '+r.staffName:''),'*Día:* '+dayText(r.date)+', '+r.time+' hs','*Turno:* #'+r.code,'*Nombre:* '+b.name];
    var wa=S.cfg.whatsappNumber?'https://wa.me/'+String(S.cfg.whatsappNumber).replace(/\D/g,'')+'?text='+encodeURIComponent(L.join('\n')):'';
    el.innerHTML=bkHead('',false)+'<div class="sheet-body"><div class="done"><div class="done-ic">'+ic('check')+'</div>'
      +'<h3 class="display">'+(pending?'¡Turno pedido!':'¡Turno reservado!')+'</h3>'
      +'<p><b style="color:var(--ink)">'+esc(r.serviceName)+'</b>'+(r.staffName?' con '+esc(r.staffName):'')+'<br>'+esc(capFirst(dayText(r.date)))+', '+esc(r.time)+' hs</p>'
      +(pending?'<p>'+esc(S.cfg.businessName)+' te lo va a confirmar por WhatsApp.</p>':'')
      +'<span class="code">#'+esc(r.code)+'</span>'
      +(S.cfg.address?'<p style="font-size:13px">'+esc(S.cfg.address)+'</p>':'')+'</div></div>'
      +'<div class="sheet-foot">'
      +(wa?'<a class="btn btn-wa btn-block" href="'+esc(wa)+'" target="_blank" rel="noopener">'+ic('wa')+'Avisar por WhatsApp</a>':'')
      +'<a class="btn btn-ghost btn-block" style="margin-top:8px;height:48px" href="'+esc(gcal)+'" target="_blank" rel="noopener">'+ic('clock')+'Agregar a mi calendario</a>'
      +'<button class="btn btn-ghost btn-block" style="margin-top:8px;height:48px;border:0" data-act="close">Listo</button></div>';
  }
}
function bkBack(){
  var b=S.bk;
  if(b.step==='data'){ b.step='time'; }
  else if(b.step==='time'){ b.step=bkStaffFor(bkService()).length>1?'staff':'service'; b.time=null; if(b.step==='service') b.staffId=null; }
  else if(b.step==='staff'){ b.step='service'; }
  renderBooking();
}
async function confirmBooking(btn){
  var b=S.bk, name=$('#bName').value.trim(), phone=$('#bPhone').value.trim(), note=$('#bNote').value.trim(), ok=true;
  $('#b-name').classList.toggle('invalid',name.length<2); if(name.length<2) ok=false;
  var digits=phone.replace(/\D/g,'');
  $('#b-phone').classList.toggle('invalid',digits.length<8); if(digits.length<8) ok=false;
  if(!ok){ toast('Revisá los datos marcados'); return; }
  try{ var prev=JSON.parse(localStorage.getItem('ventra_customer')||'{}'); localStorage.setItem('ventra_customer',JSON.stringify(Object.assign(prev,{name:name,phone:phone}))); }catch(e){}
  btn.disabled=true; btn.innerHTML='<span class="spin" style="width:22px;height:22px;border-width:3px;border-color:rgba(255,255,255,.35);border-top-color:#fff"></span>';
  try{
    var res=await fetch(BOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({storeId:S.storeId,serviceId:b.serviceId,staffId:b.staffId||'ANY',date:b.day,time:hhmm(b.time),name:name,phone:phone,note:note})});
    var data=await res.json().catch(function(){ return {}; });
    if(!res.ok){
      toast(data.error||'No se pudo reservar');
      if(res.status===409){ delete S.bkBusy[b.day]; b.step='time'; b.time=null; renderBooking(); return; }
      btn.disabled=false; btn.textContent='Confirmar turno'; return;
    }
    delete S.bkBusy[b.day];
    b.name=name; b.result=data; b.step='done'; renderBooking();
  }catch(e){
    toast('Sin conexión. Probá de nuevo.');
    btn.disabled=false; btn.textContent='Confirmar turno';
  }
}

/* ───────── eventos ───────── */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]'); if(!t) return;
  var act=t.getAttribute('data-act'), id=t.getAttribute('data-id');
  switch(act){
    case 'add': if(S.byId[id]&&(S.byId[id].isGroup||hasExtras(S.byId[id]))) break; setQty(id,1); if(navigator.vibrate) navigator.vibrate(10); toast('Agregado al pedido'); break;
    case 'inc': setQty(id,(S.cart[id]||0)+1); break;
    case 'dec': setQty(id,(S.cart[id]||0)-1); break;
    case 'product': S.openProduct=id; S.pdQty=1; S.pdOpt=null; S.pdExtras={}; renderProductSheet(id); openSheet('productSheet'); break;
    case 'pd-extra':
      var gid=t.getAttribute('data-g'), g=(S.cfg.extraGroups||[]).filter(function(x){ return x.id===gid; })[0];
      if(g){
        var cur=(S.pdExtras[gid]||[]).slice(), max=Math.max(1,Number(g.max)||1), at=cur.indexOf(id);
        if(at>=0) cur.splice(at,1);
        else if(max===1) cur=[id];
        else if(cur.length<max) cur.push(id);
        else toast('Podés elegir hasta '+max);
        S.pdExtras[gid]=cur;
        var ne=$('#pdNote'); S.pdNote=ne?ne.value:null;
        renderProductSheet(S.openProduct);
      }
      break;
    case 'pd-opt': if(!t.disabled){ var nEl=$('#pdNote'); S.pdNote=nEl?nEl.value:null; S.pdOpt=id; renderProductSheet(S.openProduct); } break;
    case 'pd-inc': var n1=$('#pdNote'); S.pdNote=n1?n1.value:null; S.pdQty++; renderProductSheet(S.openProduct); break;
    case 'pd-dec': if(S.pdQty>1){ var n2=$('#pdNote'); S.pdNote=n2?n2.value:null; S.pdQty--; renderProductSheet(S.openProduct); } break;
    case 'pd-add':
      var shown=S.byId[S.openProduct], target=shown.isGroup?S.pdOpt:S.openProduct, nEl2=$('#pdNote');
      // Extras elegidos: se validan los obligatorios y arman la clave de la línea
      var chosen=[], missingG=null;
      extrasFor(shown,S.byId[target]).forEach(function(g){
        var picked=S.pdExtras[g.id]||[];
        if(Number(g.min)>0 && !picked.length && !missingG) missingG=g;
        (g.options||[]).forEach(function(o){ if(picked.indexOf(o.id)>=0) chosen.push({id:g.id+':'+o.id,name:o.name,price:Number(o.price)||0,group:g.name}); });
      });
      if(missingG){ toast('Elegí '+missingG.name.toLowerCase()); break; }
      var key=chosen.length?target+'~'+chosen.map(function(c){ return c.id; }).sort().join('.'):target;
      if(chosen.length) S.lines[key]={extras:chosen};
      if(nEl2){ var nv=nEl2.value.trim(); if(nv) S.notes[key]=nv; else delete S.notes[key]; }
      setQty(key,(S.cart[key]||0)+S.pdQty); closeSheets(); toast('Agregado al pedido'); break;
    case 'open-cart': S.step='cart'; renderCartSheet(); openSheet('cartSheet'); break;
    case 'close': closeSheets(); break;
    case 'to-checkout': S.step='checkout'; renderCartSheet(); break;
    case 'back-cart': S.step='cart'; renderCartSheet(); break;
    case 'delivery': snapshotForm(); S.delivery=t.getAttribute('data-v'); renderCartSheet(); restoreForm(); break;
    case 'pay': snapshotForm(); S.payment=t.getAttribute('data-v'); renderCartSheet(); restoreForm(); break;
    case 'copy-alias': if(navigator.clipboard) navigator.clipboard.writeText(S.cfg.transferAlias); toast('Alias copiado'); break;
    case 'send': sendOrder(t); break;
    case 'book-open': openBooking(null); break;
    case 'book-svc': openBooking(id); break;
    case 'bk-pick-svc': S.bk.serviceId=id; S.bk.staffId=null; S.bk.time=null; if(bkStaffFor(bkService()).length>1){ S.bk.step='staff'; } else { S.bk.staffId=bkStaffFor(bkService())[0].id; S.bk.step='time'; } renderBooking(); break;
    case 'bk-pick-staff': S.bk.staffId=id; S.bk.time=null; S.bk.step='time'; renderBooking(); break;
    case 'bk-day': S.bk.day=t.getAttribute('data-v'); S.bk.time=null; renderBooking(); break;
    case 'bk-time': S.bk.time=Number(t.getAttribute('data-v')); S.bk.step='data'; renderBooking(); break;
    case 'bk-back': bkBack(); break;
    case 'bk-confirm': confirmBooking(t); break;
    case 'new-order': S.step='cart'; closeSheets(); break;
    case 'subcat': S.sub=t.getAttribute('data-cat'); renderList(); break;
    case 'cat':
      S.cat=t.getAttribute('data-cat'); S.sub='ALL'; S.q=''; var q=$('#q'); if(q) q.value=''; $('#searchBox').classList.remove('has');
      document.querySelectorAll('.cat').forEach(function(b){ b.classList.toggle('on',b===t); });
      t.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
      renderList();
      var tbar=document.querySelector('.toolbar'); window.scrollTo({top:tbar.offsetTop-60+1,behavior:'smooth'});
      break;
    case 'clear-search': S.q=''; $('#q').value=''; $('#searchBox').classList.remove('has'); renderList(); $('#q').focus(); break;
    case 'focus-search': var tb=document.querySelector('.toolbar'); window.scrollTo({top:tb.offsetTop-60+1,behavior:'smooth'}); setTimeout(function(){ $('#q').focus(); },300); break;
    case 'share':
      if(navigator.share){ navigator.share({title:S.cfg.businessName,text:S.cfg.description||'Mirá mi tienda online',url:location.href}).catch(function(){}); }
      else if(navigator.clipboard){ navigator.clipboard.writeText(location.href); toast('Enlace copiado'); }
      break;
  }
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeSheets(); });

// Al cambiar forma de entrega o pago se vuelve a dibujar el formulario: se conservan los datos escritos
var _form={};
function snapshotForm(){ ['cName','cPhone','cAddr','cNote'].forEach(function(k){ var el=document.getElementById(k); if(el) _form[k]=el.value; }); }
function restoreForm(){ Object.keys(_form).forEach(function(k){ var el=document.getElementById(k); if(el && _form[k]!=null) el.value=_form[k]; }); }

// Arrastrar hacia abajo para cerrar las hojas en el celular
(function(){
  var startY=null, sheet=null;
  document.addEventListener('touchstart',function(e){
    var g=e.target.closest('.grab,.sheet-head'); if(!g) return;
    sheet=g.closest('.sheet'); startY=e.touches[0].clientY; sheet.style.transition='none';
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(startY==null) return; var dy=Math.max(0,e.touches[0].clientY-startY); sheet.style.transform='translateY('+dy+'px)';
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(startY==null) return; var dy=e.changedTouches[0].clientY-startY; sheet.style.transition=''; sheet.style.transform='';
    if(dy>110) closeSheets(); startY=null; sheet=null;
  });
})();

init();
